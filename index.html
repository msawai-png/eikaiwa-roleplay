<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英会話ロールプレイ</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1f2937;
    --sub: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --partner: #f1f5f9;
    --me: #eff6ff;
    --ok: #16a34a;
    --ng: #dc2626;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* キーボード操作でも今どこにいるか分かるように */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 動きを減らす設定にしている人には点滅・変化を出さない */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  body {
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
    background: var(--bg); color: var(--ink);
    line-height: 1.6;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  #backBtn {
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 14px;
  }
  #backBtn:hover { background: var(--accent-soft); }
  #crumb { color: var(--sub); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }

  /* ---- カテゴリ・シーン一覧 ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .tile {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; cursor: pointer; transition: box-shadow .15s, transform .15s;
  }
  .tile:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); transform: translateY(-2px); }
  .tile .emoji { font-size: 30px; }
  .tile .name { font-weight: 700; font-size: 16px; margin-top: 8px; }
  .tile .desc { color: var(--sub); font-size: 13px; margin-top: 4px; }
  .tile .meta { color: var(--accent); font-size: 12px; margin-top: 8px; }

  /* ---- 会話画面 ---- */
  .toolbar {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  }
  .toolbar label { font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .toolbar select, .toolbar input[type=range] { font-size: 13px; }
  .btn {
    border: none; border-radius: 8px; padding: 9px 20px; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { background: var(--card); border: 1px solid var(--border); color: var(--ink); }
  .btn-ghost:hover { background: var(--accent-soft); }
  .btn:disabled { opacity: .45; cursor: default; }

  .colhead {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    font-size: 12px; color: var(--sub); font-weight: 700;
    padding: 0 6px 6px;
  }
  .turn {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 10px; border-radius: 12px; padding: 6px;
    border: 2px solid transparent;
  }
  .turn.active { border-color: var(--accent); background: #fff; box-shadow: 0 2px 10px rgba(37,99,235,.15); }
  .cell {
    border-radius: 10px; padding: 10px 14px; font-size: 15px;
    background: var(--card); border: 1px solid var(--border);
  }
  .turn.partner .cell.en { background: var(--partner); }
  .turn.me .cell.en { background: var(--me); }
  .cell .speaker { font-size: 11px; font-weight: 700; color: var(--sub); display: block; margin-bottom: 2px; }
  .turn.me .cell .speaker { color: var(--accent); }
  .cell.ja { color: #374151; font-size: 14px; }
  .cell.en { cursor: pointer; }
  .cell.en:hover { outline: 2px solid var(--accent-soft); }
  .en-text.hidden-text {
    filter: blur(6px); user-select: none; transition: filter .2s;
  }
  .turn .revealTag { font-size: 11px; color: var(--accent); margin-left: 6px; }

  /* 練習パネル */
  #panel {
    position: sticky; bottom: 0; background: var(--card);
    border-top: 2px solid var(--accent); padding: 14px 20px;
    display: none; z-index: 10; box-shadow: 0 -4px 16px rgba(0,0,0,.08);
  }
  #panel.show { display: block; }
  #panelInner { max-width: 1100px; margin: 0 auto; }
  #panelStatus { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  #panelStatus .mic-on { color: var(--ng); }
  #micState { font-size: 12.5px; min-height: 18px; margin: 2px 0 4px; }
  #micState .mic-live { color: var(--ng); font-weight: 700; animation: micblink 1.4s infinite; }
  #micState .mic-idle { color: var(--sub); }
  @keyframes micblink { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  #recognized { font-size: 15px; min-height: 24px; margin-bottom: 8px; }
  #recognized .w-ok { color: var(--ok); font-weight: 600; }
  #recognized .w-ng { color: var(--ng); }
  #scoreBadge {
    display: inline-block; border-radius: 999px; padding: 2px 12px;
    font-size: 13px; font-weight: 700; margin-left: 8px;
  }
  .score-high { background: #dcfce7; color: var(--ok); }
  .score-low { background: #fee2e2; color: var(--ng); }
  #panelBtns { display: flex; gap: 10px; flex-wrap: wrap; }

  /* シーンが多いカテゴリ用の絞り込み欄 */
  .filter-bar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px;
  }
  .filter-bar input {
    flex: 1; border: none; outline: none; font-size: 15px;
    background: transparent; color: var(--ink); min-width: 0;
  }
  .filter-bar input::placeholder { color: var(--sub); }
  .filter-bar .count { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .filter-bar .clear {
    border: none; background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  .filter-empty { color: var(--sub); font-size: 14px; padding: 8px 4px; }

  .note {
    background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; color: #92400e; margin-bottom: 16px;
  }
  .done-badge { color: var(--ok); font-weight: 700; }

  /* ---- 音声アシスタント ---- */
  #asBtn {
    margin-left: auto; border: 1px solid var(--border); background: var(--card);
    color: var(--ink); border-radius: 999px; padding: 6px 14px;
    cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  #asBtn.on { background: var(--ng); color: #fff; border-color: var(--ng); }
  #asBar {
    display: none; background: #eef2ff; border-bottom: 1px solid #c7d2fe;
    padding: 6px 20px; font-size: 12.5px; color: #3730a3;
  }
  #asBar.show { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  #asHeard { font-weight: 700; transition: opacity .4s; }
  @media (max-width: 720px) {
    #asBtn { padding: 8px 12px; font-size: 12px; }
    #asBar { padding: 6px 12px; }
  }

  /* ---- 単語ホバー辞書 ---- */
  .w { border-radius: 3px; padding: 0 1px; }
  .w.has { border-bottom: 1px dotted #9ca3af; cursor: help; }
  .w.has:hover { background: #fef3c7; border-bottom-color: #d97706; }
  .w.ph { border-bottom: 2px solid #c4b5fd; background: #f5f3ff; cursor: help; }
  .w.ph:hover { background: #e9d5ff; border-bottom-color: #7c3aed; }
  .hidden-text .w { border-bottom-color: transparent; background: none; cursor: default; }

  #tip {
    position: fixed; z-index: 100; display: none;
    max-width: 340px; background: #1f2937; color: #f9fafb;
    border-radius: 10px; padding: 10px 13px; font-size: 13px; line-height: 1.55;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
  }
  #tip.show { display: block; }
  .tip-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .tip-term { font-weight: 700; font-size: 15px; color: #fff; }
  .tip-tag {
    font-size: 10px; border-radius: 999px; padding: 1px 7px;
    background: #7c3aed; color: #fff; font-weight: 700;
  }
  .tip-tag.word { background: #2563eb; }
  .tip-say {
    margin-left: auto; background: #374151; border: none; color: #f9fafb;
    border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px;
  }
  .tip-say:hover { background: #4b5563; }
  .tip-mean { color: #fde68a; margin-bottom: 6px; }
  .tip-ex { border-top: 1px solid #374151; padding-top: 6px; font-size: 12.5px; }
  .tip-ex .en { color: #d1fae5; }
  .tip-ex .ja { color: #9ca3af; }
  .tip-chips { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tip-chip {
    background: #374151; border: none; color: #e5e7eb; border-radius: 999px;
    padding: 2px 9px; font-size: 11.5px; cursor: pointer;
  }
  .tip-chip:hover { background: #4b5563; color: #fff; }
  .tip-none { color: #9ca3af; }

  /* 画面が狭いときは、吹き出しを単語の近くではなく画面上部に固定して出す
     （指で触ると単語が指の下に隠れるため） */
  #tip.sheet {
    left: 8px; right: 8px; top: 8px; bottom: auto;
    max-width: none; font-size: 14px; padding: 13px 15px;
  }

  /* ---- スマホ・タブレット ---- */
  @media (max-width: 720px) {
    header { padding: 9px 12px; gap: 8px; }
    header h1 { font-size: 15px; }
    #crumb { font-size: 11.5px; }
    #backBtn { padding: 8px 12px; }
    main { padding: 12px; }

    .grid { grid-template-columns: 1fr; gap: 10px; }
    .tile { padding: 14px; }

    /* 英語と日本語を横並びから縦積みに変える */
    .turn { grid-template-columns: 1fr; gap: 3px; padding: 4px; }
    .cell { padding: 9px 12px; }
    .cell.ja {
      background: transparent; border: none;
      padding: 2px 12px 6px; font-size: 13px;
    }
    .cell.ja .speaker { display: none; }
    .colhead { grid-template-columns: 1fr; font-size: 11px; }
    .colhead div:last-child { display: none; }

    .toolbar { padding: 10px 12px; gap: 9px; }
    .toolbar label { width: 100%; }
    .toolbar select { flex: 1; padding: 6px; }
    .toolbar input[type=range] { flex: 1; }
    #btnStart { width: 100%; padding: 12px; font-size: 15px; }

    #panel { padding: 10px 12px; }
    #panelStatus { font-size: 13.5px; }
    #panelBtns { gap: 6px; }
    #panelBtns .btn { flex: 1 1 46%; padding: 11px 8px; font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <button id="backBtn" style="display:none">← 戻る</button>
  <h1>英会話ロールプレイ</h1>
  <span id="crumb"></span>
  <button id="asBtn" title="音声でアプリを操作する">🎙 音声操作</button>
</header>

<div id="asBar"><span id="asHeard"></span><span id="asHint"></span></div>

<main id="main"></main>

<div id="panel">
  <div id="panelInner">
    <div id="panelStatus"></div>
    <div id="micState"></div>
    <div id="recognized"></div>
    <div id="panelBtns">
      <button class="btn btn-ghost" id="btnReplay">🔊 もう一度聞く</button>
      <button class="btn btn-ghost" id="btnAnswerVoice">🗣 答えの音声を聞く</button>
      <button class="btn btn-ghost" id="btnReveal">👀 答えの英文を見る</button>
      <button class="btn btn-ghost" id="btnRetry">🎤 もう一度話す</button>
      <button class="btn btn-primary" id="btnNext">言えた → 次へ ▶</button>
      <button class="btn btn-ghost" id="btnStop">■ 終了</button>
    </div>
  </div>
</div>

<div id="tip"></div>

<script>
/* --- dictionary.js を埋め込み（正本は dictionary.js） --- */
// ============================================================
// 単語・熟語辞書（index.html と同じフォルダに置いてください）
//
// 形式： "見出し語": ["意味", "例文(英語)", "例文の訳"]
// 単語を追加したいときは WORDS に、熟語は PHRASES に同じ形式で足すだけ。
// PHRASES は単語より優先して照合され、長い熟語から先に一致します。
// ============================================================

const PHRASES = {
  // --- 買い物 ---
  "hi there": ["やあ／いらっしゃいませ（くだけた挨拶）", "Hi there! How can I help you?", "いらっしゃいませ。何かお探しですか？"],
  "look for": ["〜を探す（探している最中）", "I'm looking for a jacket.", "ジャケットを探しています。"],
  "in particular": ["特に／具体的に", "Are you looking for anything in particular?", "何か特にお探しのものはありますか？"],
  "depend on": ["〜によって決まる／〜次第だ", "It depends on the brand.", "ブランドによって変わります。"],
  "come in": ["入荷する／入ってくる", "These just came in.", "これは入荷したばかりです。"],
  "would you like to": ["〜なさいますか（丁寧な誘い・勧め）", "Would you like to try it on?", "ご試着なさいますか？"],
  "would you like": ["〜はいかがですか（丁寧に希望を聞く）", "Would you like a bag?", "袋はご利用になりますか？"],
  "i'd like to": ["〜したいのですが（丁寧に希望を言う）", "I'd like to return this.", "これを返品したいのですが。"],
  "try on": ["試着する（try it on の語順に注意）", "Can I try this on?", "これを試着できますか？"],
  "try one on": ["（そのうちの）1つを試着する", "Would you like to try one on?", "1着ご試着なさいますか？"],
  "fitting room": ["試着室", "Where is the fitting room?", "試着室はどこですか？"],
  "right over there": ["すぐあちらです（場所を指して）", "It's right over there.", "すぐあちらにございます。"],
  "next to": ["〜の隣に", "It's next to the mirrors.", "鏡の隣です。"],
  "how does it fit": ["サイズはいかがですか（着心地を聞く）", "How does it fit?", "サイズ感はいかがですか？"],
  "a little": ["少し（形容詞の前に置いて和らげる）", "It's a little tight.", "少しきついです。"],
  "let me check": ["確認させてください（すぐ調べます）", "Let me check our stock.", "在庫を確認しますね。"],
  "here it is": ["これです（差し出すとき）", "Yes, here it is.", "はい、これです。"],
  "i'll take it":["これをください（購入を決めるときの定番）", "This one fits perfectly. I'll take it.", "これはぴったりです。これをください。"],
  "great choice": ["よいお選びです（店員の褒め言葉）", "Great choice!", "すてきなお買い物ですね。"],
  "cash or card": ["現金かカードか", "Will that be cash or card?", "お支払いは現金かカードどちらですか？"],
  "may i ask": ["お伺いしてもよいですか（丁寧に質問する）", "May I ask the reason?", "理由をお伺いしてもよろしいですか？"],
  "the reason for": ["〜の理由", "May I ask the reason for the return?", "返品の理由をお伺いできますか？"],
  "i see": ["なるほど／そうですか（相づち）", "I see. Do you have the receipt?", "なるほど。レシートはお持ちですか？"],
  "with you": ["（手元に）持っている", "Do you have the receipt with you?", "レシートはお手元にありますか？"],
  "would you prefer": ["どちらがご希望ですか（丁寧に選ばせる）", "Would you prefer to exchange it?", "交換をご希望ですか？"],
  "of course": ["もちろんです", "Of course. I'll do that now.", "もちろんです。すぐにやります。"],
  "right away": ["すぐに", "I'll process that right away.", "すぐに手続きします。"],
  "thank you for your help": ["助けていただきありがとう", "Thank you for your help.", "ご対応ありがとうございました。"],

  // --- 友達との会話 ---
  "plans for": ["〜の予定", "Do you have any plans for the weekend?", "週末の予定はある？"],
  "not really": ["特にない／そうでもない（やわらかい否定）", "Not really. I'm free.", "特にないよ。空いてる。"],
  "was going to": ["〜するつもりだった", "I was going to relax at home.", "家でゆっくりするつもりだった。"],
  "how about you": ["あなたはどう？（質問を返す）", "I'm fine. How about you?", "元気だよ。そっちは？"],
  "how about": ["〜はどう？（提案する）", "How about Wednesday afternoon?", "水曜の午後はどうですか？"],
  "a few of us": ["私たちのうち何人か", "A few of us are going hiking.", "何人かでハイキングに行くんだ。"],
  "want to join": ["一緒に来る？（気軽な誘い）", "Want to join?", "一緒に行かない？"],
  "sounds fun": ["楽しそう（相手の話への反応）", "That sounds fun!", "それ楽しそう！"],
  "sounds good": ["いいね／了解（同意の定番）", "Sounds good. See you then.", "了解。ではその時に。"],
  "not too": ["そんなに〜ではない", "It's not too hard.", "そんなにきつくないよ。"],
  "what time": ["何時に", "What time are you leaving?", "何時に出発するの？"],
  "in the morning": ["午前中に／朝に", "We're meeting at eight in the morning.", "朝8時に集合です。"],
  "make it": ["都合をつけて行く／間に合う", "I'll try to make it.", "行けるようにするよ。"],
  "should we": ["〜しようか？（一緒にどうかと持ちかける）", "Should we grab lunch?", "お昼を買っていこうか？"],
  "grab lunch": ["昼食を軽く食べる／買う", "Should we grab lunch on the way?", "途中でお昼を買っていこうか？"],
  "on the way": ["途中で", "There's a store on the way.", "途中に店があります。"],
  "good idea": ["いい考えだね", "Good idea. Let's do that.", "いいね。そうしよう。"],
  "see you": ["またね（別れの挨拶）", "See you on Saturday!", "土曜にね！"],
  "look forward to": ["〜を楽しみにする（to の後ろは名詞か ing）", "I'm looking forward to it.", "楽しみにしています。"],
  "it's been a while": ["久しぶりだね", "It's been a while! How are you?", "久しぶり！元気？"],
  "how have you been": ["元気にしてた？（久しぶりの相手に）", "How have you been?", "どうしてた？"],
  "busy with": ["〜で忙しい", "I've been busy with work.", "仕事で忙しかったよ。"],
  "change jobs": ["転職する（jobs は複数形にする）", "I changed jobs last month.", "先月転職しました。"],
  "so far": ["今のところ", "I like it so far.", "今のところ気に入っています。"],
  "a lot to learn": ["覚えることが多い", "There's a lot to learn.", "覚えることが多いです。"],
  "i know the feeling": ["その気持ち分かるよ（共感）", "I know the feeling.", "その気持ち、分かるよ。"],
  "by the way": ["ところで（話題を変える）", "By the way, are you still going to the gym?", "ところで、まだジムに通ってる？"],
  "as often as": ["〜と同じくらいの頻度で", "Not as often as before.", "前ほど頻繁ではないよ。"],
  "twice a week": ["週2回", "I go twice a week.", "週2回行っています。"],
  "catch up": ["近況を話す／遅れを取り戻す", "We should catch up soon.", "近いうちに話そうよ。"],
  "over dinner": ["夕食を食べながら", "Let's catch up over dinner.", "夕食を食べながら話そう。"],
  "are you free": ["空いてる？（都合を聞く）", "Are you free next Friday?", "来週の金曜は空いてる？"],
  "works for me": ["私はそれで大丈夫（都合がよい）", "Friday works for me.", "金曜で大丈夫です。"],
  "talk to you later": ["またあとで話そう（別れ際）", "Talk to you later!", "またね！"],

  // --- 職場 ---
  "do you have a minute": ["少しお時間ありますか（話しかける前置き）", "Do you have a minute?", "ちょっとよろしいですか？"],
  "check on": ["〜の様子・進み具合を確認する", "I wanted to check on the report.", "レポートの進捗を確認したかったんです。"],
  "wait for": ["〜（もの）を待つ", "I'm waiting for the data.", "データを待っています。"],
  "wait on": ["〜（人）からの返事を待つ", "Who are you waiting on?", "誰の返事待ちですか？"],
  "hear back": ["返事をもらう", "I haven't heard back yet.", "まだ返事がありません。"],
  "follow up": ["催促する／その後を確認する", "I'll follow up with them.", "私から催促しておきます。"],
  "that would really help": ["それは本当に助かります", "Thank you. That would really help.", "ありがとうございます。助かります。"],
  "anything else": ["ほかに何かありますか", "Anything else you need?", "ほかに必要なものはありますか？"],

  set(k, v) {

// ============================================================
// 単語・熟語のホバー辞書（辞書データは dictionary.js）
// ============================================================
const dictReady = (typeof WORDS === "object" && typeof PHRASES === "object");

// 熟語を照合するときだけ使う活用そろえ（looking for → look for と当てるため）
const PH_LEMMA = {
  "looking":"look","looked":"look","looks":"look",
  "going":"go","goes":"go","went":"go",
  "came":"come","comes":"come","coming":"come",
  "got":"get","gets":"get","getting":"get",
  "made":"make","makes":"make","making":"make",
  "trying":"try","tried":"try","tries":"try",
  "waiting":"wait","waited":"wait","waits":"wait",
  "checking":"check","checked":"check","checks":"check",
  "changed":"change","changing":"change","changes":"change",
  "heard":"hear","hears":"hear","hearing":"hear",
  "asked":"ask","asks":"ask","asking":"ask",
  "depends":"depend","depended":"depend","depending":"depend",
  "turned":"turn","turning":"turn","turns":"turn",
  "grabbed":"grab","grabs":"grab","grabbing":"grab",
  "caught":"catch","catches":"catch","catching":"catch",
  "extended":"extend","extends":"extend",
  "followed":"follow","follows":"follow","following":"follow",
  "fits":"fit","fitted":"fit","fitting":"fit",
  "took":"take","takes":"take","taking":"take",
  "sent":"send","sends":"send","sending":"send",
  "wore":"wear","wears":"wear","wearing":"wear",
  "moved":"move","moves":"move"
};

const PHRASE_LIST = dictReady
  ? Object.keys(PHRASES).map(k => k.split(" ").length)
  : [];
const MAX_PHRASE_LEN = PHRASE_LIST.length ? Math.max.apply(null, PHRASE_LIST) : 0;
const PHRASE_SET = new Set(dictReady ? Object.keys(PHRASES) : []);

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function norm(w) { return w.toLowerCase().replace(/’/g, "'"); }
function phLemma(w) { return PH_LEMMA[w] || w; }

// 単語を引く（活用形からも原形にたどる）
function lookupWord(w) {
  if (!dictReady) return null;
  const k = norm(w);
  if (WORDS[k]) return { key: k, e: WORDS[k] };
  const m = (typeof LEMMA_MAP === "object") ? LEMMA_MAP[k] : null;
  if (m && WORDS[m]) return { key: m, e: WORDS[m] };
  const cands = [];
  if (/ies$/.test(k)) cands.push(k.slice(0, -3) + "y");
  if (/(es|ed)$/.test(k)) cands.push(k.slice(0, -2), k.slice(0, -1));
  if (/s$/.test(k)) cands.push(k.slice(0, -1));
  if (/ing$/.test(k)) cands.push(k.slice(0, -3), k.slice(0, -3) + "e");
  const dbl = k.match(/^(.*?)([a-z])\2(ed|ing)$/);
  if (dbl) cands.push(dbl[1] + dbl[2]);
  for (const c of cands) if (WORDS[c]) return { key: c, e: WORDS[c] };
  return null;
}

// 英文を、単語・熟語ごとにホバーできる span 付きHTMLに変換する
const WORD_RE = /[A-Za-z]+(?:['’-][A-Za-z]+)*/g;
function markup(text) {
  if (!dictReady) return esc(text);
  const toks = [];
  let m;
  WORD_RE.lastIndex = 0;
  while ((m = WORD_RE.exec(text)) !== null) toks.push({ w: m[0], s: m.index, e: m.index + m[0].length });

  let out = "", pos = 0, i = 0;
  while (i < toks.length) {
    out += esc(text.slice(pos, toks[i].s));
    // 熟語は長いものから優先して照合する
    let hit = null;
    for (let n = Math.min(MAX_PHRASE_LEN, toks.length - i); n >= 2; n--) {
      const seg = toks.slice(i, i + n).map(t => norm(t.w));
      const raw = seg.join(" ");
      const lem = seg.map(phLemma).join(" ");
      const key = PHRASE_SET.has(raw) ? raw : (PHRASE_SET.has(lem) ? lem : null);
      if (key) { hit = { key: key, n: n }; break; }
    }
    if (hit) {
      const last = toks[i + hit.n - 1];
      out += `<span class="w ph" data-t="p" data-k="${esc(hit.key)}">${esc(text.slice(toks[i].s, last.e))}</span>`;
      pos = last.e; i += hit.n; continue;
    }
    const t = toks[i];
    const found = lookupWord(t.w);
    out += found
      ? `<span class="w has" data-t="w" data-k="${esc(found.key)}">${esc(t.w)}</span>`
      : `<span class="w">${esc(t.w)}</span>`;
    pos = t.e; i++;
  }
  return out + esc(text.slice(pos));
}

// ---- 吹き出し ----
const tip = $("tip");
let tipShowTimer = null, tipHideTimer = null, tipOverTip = false, tipAnchor = null;

function tipData(type, key) {
  if (!dictReady) return null;
  if (type === "p") {
    const e = PHRASES[key];
    return e ? { term: key, tag: "熟語", cls: "", e: e, sub: key.split(" ") } : null;
  }
  const e = WORDS[key];
  return e ? { term: key, tag: "単語", cls: "word", e: e, sub: null } : null;
}

function renderTip(type, key, backTo) {
  const d = tipData(type, key);
  if (!d) {
    tip.innerHTML = `<div class="tip-none">この語は辞書に登録されていません</div>`;
    return;
  }
  const mean = d.e[0], ex = d.e[1], exja = d.e[2];
  const chips = [];
  if (TOUCH) chips.push(`<button class="tip-chip" data-close="1">✕ 閉じる</button>`);
  if (backTo) chips.push(`<button class="tip-chip" data-back="${esc(backTo)}">← ${esc(backTo)}</button>`);
  if (d.sub) d.sub.forEach(w => {
    const f = lookupWord(w);
    if (f) chips.push(`<button class="tip-chip" data-word="${esc(f.key)}" data-from="${esc(key)}">${esc(w)}</button>`);
  });
  tip.innerHTML = `
    <div class="tip-head">
      <span class="tip-term">${esc(d.term)}</span>
      <span class="tip-tag ${d.cls}">${d.tag}</span>
      <button class="tip-say" data-say="${esc(d.term)}">🔊</button>
    </div>
    <div class="tip-mean">${esc(mean)}</div>
    <div class="tip-ex" data-say="${esc(ex)}" title="クリックで読み上げ">
      <div class="en">${esc(ex)}</div><div class="ja">${esc(exja)}</div>
    </div>
    ${chips.length ? `<div class="tip-chips">${chips.join("")}</div>` : ""}`;
}

// スマホ・タブレットはマウスを乗せる操作が無いので、タップで意味を出す
const TOUCH = window.matchMedia("(hover: none)").matches;
const isNarrow = () => window.innerWidth <= 720;

function placeTip(rect) {
  tip.classList.add("show");
  if (isNarrow()) {                 // 画面上部に固定して出す
    tip.classList.add("sheet");
    tip.style.left = "";
    tip.style.top = "";
    return;
  }
  tip.classList.remove("sheet");
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = rect.left, top = rect.bottom + 8;
  if (left + tw > window.innerWidth - 10) left = window.innerWidth - tw - 10;
  if (left < 10) left = 10;
  if (top + th > window.innerHeight - 10) top = rect.top - th - 8;
  if (top < 6) top = 6;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}

function hideTip() { tip.classList.remove("show"); tipAnchor = null; }

document.addEventListener("mouseover", (ev) => {
  if (TOUCH) return;                        // タッチ端末では下の click で扱う
  const el = ev.target.closest && ev.target.closest(".w[data-k]");
  if (!el) return;
  if (el.closest(".hidden-text")) return;   // 英文を隠している間は答えを見せない
  clearTimeout(tipHideTimer); clearTimeout(tipShowTimer);
  tipShowTimer = setTimeout(() => {
    tipAnchor = el;
    renderTip(el.dataset.t, el.dataset.k, null);
    placeTip(el.getBoundingClientRect());
  }, 180);
});
document.addEventListener("mouseout", (ev) => {
  if (TOUCH) return;
  const el = ev.target.closest && ev.target.closest(".w[data-k]");
  if (!el) return;
  clearTimeout(tipShowTimer);
  tipHideTimer = setTimeout(() => { if (!tipOverTip) hideTip(); }, 260);
});

// タッチ端末：単語をタップしたら意味を出す（文の読み上げには進ませない）
document.addEventListener("click", (ev) => {
  if (!TOUCH) return;
  const el = ev.target.closest && ev.target.closest(".w[data-k]");
  if (el) {
    if (el.closest(".hidden-text")) return;   // 伏せている間は答えを見せない
    ev.stopPropagation();
    ev.preventDefault();
    tipAnchor = el;
    renderTip(el.dataset.t, el.dataset.k, null);
    placeTip(el.getBoundingClientRect());
    return;
  }
  if (!ev.target.closest("#tip")) hideTip();   // 吹き出しの外をタップしたら閉じる
}, true);
tip.addEventListener("mouseenter", () => { tipOverTip = true; clearTimeout(tipHideTimer); });
tip.addEventListener("mouseleave", () => { tipOverTip = false; hideTip(); });
tip.addEventListener("click", (ev) => {
  if (ev.target.closest("[data-close]")) { hideTip(); return; }
  const say = ev.target.closest("[data-say]");
  if (say) { speak(say.dataset.say); return; }
  const wc = ev.target.closest("[data-word]");
  if (wc) {
    renderTip("w", wc.dataset.word, wc.dataset.from);
    if (tipAnchor) placeTip(tipAnchor.getBoundingClientRect());
    return;
  }
  const bk = ev.target.closest("[data-back]");
  if (bk) {
    renderTip("p", bk.dataset.back, null);
    if (tipAnchor) placeTip(tipAnchor.getBoundingClientRect());
  }
});
window.addEventListener("scroll", hideTip, true);
window.addEventListener("resize", hideTip);
window.addEventListener("orientationchange", hideTip);

// ---- 音声合成（TTS） ----
let enVoice = null;
let jaVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
  enVoice =
    vs.find(v => /Natural|Online/.test(v.name) && v.lang === "en-US") ||
    vs.find(v => v.lang === "en-US") || vs[0] || null;
  const js = speechSynthesis.getVoices().filter(v => v.lang.startsWith("ja"));
  jaVoice = js.find(v => /Natural|Online/.test(v.name)) || js[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

let ttsUnlocked = false;    // iOS 対策（下の unlockTTS を参照）

// iOS Safari は利用者の操作を伴わない読み上げを拒む。最初のタップの中で
// 音量0の読み上げを1回通しておくと、以降タイマーからの読み上げも通るようになる。
function unlockTTS() {
  if (ttsUnlocked) return;
  ttsUnlocked = true;
  try {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch {}
}

let ttsToken = 0;        // 読み上げの世代番号。cancel() で消えた古い読み上げの通知を無視するため
let partnerPending = null;  // 相手のセリフを読み上げ中のターン番号（割り込まれたら読み直す）

function speak(text, onend) { return speakCore(text, onend, "en"); }
function speakJa(text, onend) { return speakCore(text, onend, "ja"); }

function speakCore(text, onend, lang) {
  const token = ++ttsToken;
  // 相手が話している最中に別の音声（辞書の例文など）を鳴らすと、相手のセリフが
  // 途中で切れてしまう。その場合は割り込みが終わってから最初から読み直す。
  const interrupted = partnerPending;
  // 読み上げ中は、スピーカーから出た音を発話として拾わないよう聞き取りを止める。
  const resume = micWanted;
  ttsBusy = true;
  pauseListening();
  asPause();
  if (resume) setMicState("tts");

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (lang === "ja") {
    u.lang = "ja-JP";
    if (jaVoice) u.voice = jaVoice;
    u.rate = 1.0;
  } else {
    u.lang = "en-US";
    if (enVoice) u.voice = enVoice;
    u.rate = settings.rate;
  }

  const finish = () => {
    if (token !== ttsToken) return;   // 既に別の読み上げに切り替わっている
    ttsBusy = false;
    if (onend) onend();
    if (resume && micWanted) setTimeout(startListening, 250);
    else setTimeout(asMaybeListen, 250);   // 音声操作の聞き取りに戻す
    if (interrupted !== null && practice && practice.idx === interrupted) {
      setTimeout(playTurn, 300);      // 割り込みで切れた相手のセリフを読み直す
    }
  };
  u.onend = finish;
  u.onerror = finish;
  speechSynthesis.speak(u);
  return u;
}

// ---- 音声認識 ----
// 【重要】SpeechRecognition は無言が数秒続くと自分で終了する（continuous でも起きる）。
// 終了したまま放置すると「自分のターンで少し待つ／単語の意味を調べる」だけで
// マイクが黙って死ぬため、聞き取りたい状態が続く限り自動で張り直す。
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function micAvailable() { return !!SR; }

const IDLE_MIC_MS = 10 * 60 * 1000;   // これ以上無言が続いたら聞き取りを止める
let recog = null;        // 現在の認識インスタンス
let micWanted = false;   // いま聞き取っていたい状態か（自分のターン中）
let micTurn = null;      // 聞き取り対象のターン
let ttsBusy = false;     // 読み上げ中か
let micSince = 0;        // 聞き取りを始めた時刻
let micFails = 0;        // 聞き取りを始められなかった回数（原因の表示に使う）

// マイクが使えないと分かったら、理由と代わりの進め方を必ず画面に出す。
// （Safari や埋め込み表示では「対応はしているが許可されない」ことがあり、
//   黙って止まると理由が分からないため）
function micUnusable(reason) {
  micWanted = false;
  micTurn = null;
  pauseListening();
  setMicState("");
  setStatus(`<span class="mic-on">⚠ この環境ではマイク判定が使えません（${esc(reason)}）。</span><br>
    英文を声に出して読んでから「言えた → 次へ」を押す形で練習してください。
    マイク判定を使いたい場合は、PCで開いてください。`);
  setBtns({ replay: true, answer: true, reveal: settings.mode === "hide", retry: true, next: true });
}

function setMicState(kind) {
  const el = $("micState");
  if (!el) return;
  if (kind === "listening")   el.innerHTML = `<span class="mic-live">🎤 聞き取り中</span>`;
  else if (kind === "tts")    el.innerHTML = `<span class="mic-idle">⏸ 読み上げ中は聞き取りを止めています</span>`;
  else if (kind === "paused") el.innerHTML = `<span class="mic-idle">⏸ 聞き取りを止めました（「🎤 もう一度話す」で再開できます）</span>`;
  else el.innerHTML = "";
}

// 聞き取りを始める／張り直す
function startListening() {
  if (!micWanted || ttsBusy || !micAvailable()) return;
  if (Date.now() - micSince > IDLE_MIC_MS) {   // 長時間無言なら止める
    micWanted = false;
    setMicState("paused");
    setBtns({ replay: true, answer: true, reveal: settings.mode === "hide", retry: true, next: true });
    return;
  }
  asPause();   // 音声認識は同時に1つしか動かせないため、先にアシスタント側を止める
  if (recog) { const old = recog; recog = null; try { old.abort(); } catch {} }

  const t = micTurn;
  const r = new SR();
  r.lang = "en-US";
  r.continuous = true;        // 途中で切れにくくする（それでも切れるので onend で張り直す）
  r.interimResults = false;
  r.maxAlternatives = 1;

  r.onresult = (e) => {
    if (recog !== r || !practice) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const said = (e.results[i][0].transcript || "").trim();
        if (said) {
          micFails = 0;
          // 音声操作がオンなら、発話をまずコマンドとして解釈する
          // （英語判定が動いている間はコマンドも英語で受ける。完全一致のみ）
          if (assistantOn && handleEnCommand(said, t)) return;
          showFeedback(said, t);
          return;
        }
      }
    }
  };

  r.onerror = (e) => {
    if (recog !== r) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      micUnusable("マイクの使用が許可されていません");
    } else if (e.error === "audio-capture") {
      micUnusable("マイクが見つかりません");
    } else if (e.error !== "no-speech" && e.error !== "aborted") {
      // network など。1回目は張り直して様子を見て、続いたら理由を出す
      micFails++;
      if (micFails >= 3) micUnusable("音声認識のエラー：" + e.error);
    }
    // no-speech / aborted は下の onend で張り直す
  };

  r.onend = () => {
    if (recog !== r) return;   // 自分で止めた分は張り直さない（読み上げ後などは別経路で再開する）
    recog = null;
    if (!micWanted || ttsBusy || !practice) return;
    setTimeout(startListening, 250);
  };

  recog = r;
  try {
    r.start();
    setMicState("listening");
  } catch (err) {
    recog = null;
    micFails++;
    if (micFails >= 2) micUnusable("マイクの開始が拒否されました");
  }
}

// 読み上げの間だけ止める（自分のターンであることは保つ）
function pauseListening() {
  if (recog) { const old = recog; recog = null; try { old.abort(); } catch {} }
}

// ターンを終える・練習を止めるときに完全に止める
function stopListening() {
  micWanted = false;
  micTurn = null;
  pauseListening();
  setMicState("");
  setTimeout(asMaybeListen, 300);   // マイクが空いたら音声操作の聞き取りに戻す
}

// ============================================================
// 音声アシスタント（音声でアプリを操作する）
//
// 制約：ブラウザの音声認識は一度に1つ・1言語しか動かせない。そこで
//   ・メニュー画面や、マイク判定オフの練習中 → 日本語コマンドで聞き取る
//   ・マイク判定オンの自分のターン → 英語判定が動いているため、
//     コマンドも英語（I don't know / hint / in Japanese など）で受ける
// マイクを勝手に開かないよう、毎回ボタンで明示的にオンにする（保存しない）。
// ============================================================
let assistantOn = false;
let asRecog = null;      // アシスタント用の認識インスタンス（日本語）
let asPending = null;    // 「はい」で実行する確認待ちの内容
let asPendingAt = 0;
let asSince = 0;         // 無音の起点（長時間無音なら自動で止める）

function asPause() {
  if (asRecog) { const old = asRecog; asRecog = null; try { old.abort(); } catch {} }
}

function asMaybeListen() {
  updateAsBar();
  if (!assistantOn || !micAvailable() || ttsBusy || micWanted || asRecog) return;
  if (Date.now() - asSince > IDLE_MIC_MS) {   // 長時間無音なら止める（開きっぱなし防止）
    setAssistant(false);
    showAsHeard("しばらく無音だったため音声操作を止めました");
    return;
  }
  const r = new SR();
  r.lang = "ja-JP";
  r.continuous = true;
  r.interimResults = false;
  r.maxAlternatives = 1;
  r.onresult = (e) => {
    if (asRecog !== r) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const heard = (e.results[i][0].transcript || "").trim();
        if (heard) { asSince = Date.now(); handleJaCommand(heard); return; }
      }
    }
  };
  r.onerror = (e) => {
    if (asRecog !== r) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
      setAssistant(false);
      showAsHeard("⚠ マイクが使えないため音声操作を止めました");
    }
  };
  r.onend = () => {
    if (asRecog !== r) return;   // 自分で止めた分は張り直さない
    asRecog = null;
    setTimeout(asMaybeListen, 250);
  };
  asRecog = r;
  try { r.start(); } catch { asRecog = null; }
  updateAsBar();
}

function setAssistant(on) {
  assistantOn = on;
  if (on) { asSince = Date.now(); asMaybeListen(); }
  else { asPause(); asPending = null; }
  updateAsBar();
}

function updateAsBar() {
  const bar = $("asBar"), btn = $("asBtn");
  if (!bar || !btn) return;
  btn.classList.toggle("on", assistantOn);
  btn.textContent = assistantOn ? "🎙 音声操作 ON" : "🎙 音声操作";
  bar.classList.toggle("show", assistantOn);
  if (!assistantOn) return;
  let hint;
  if (asPending) hint = "「はい」で実行、「いいえ」で取り消し";
  else if (practice && micWanted) hint = '英語で：I don\'t know ／ hint ／ in Japanese ／ what does ○○ mean ／ one more time ／ slower ／ next ／ stop';
  else if (practice) hint = "「わからない」「ヒント」「日本語で」「もう一度」「ゆっくり」「次へ」「終了」";
  else if (view.page === "home") hint = "カテゴリ名（「病院」など）か、やりたいシーン名を話しかけてください";
  else if (view.page === "scenes") hint = "シーン名を言うと確認して開始します。「戻る」も使えます";
  else hint = "「開始」で練習を始めます。「戻る」「次のシーン」も使えます";
  $("asHint").textContent = hint;
}

function showAsHeard(text) {
  const el = $("asHeard");
  if (!el) return;
  el.textContent = text;
  el.style.opacity = 1;
  setTimeout(() => { el.style.opacity = .55; }, 1800);
}

// ---- 日本語の言い回しの照合 ----
function normJa(x) {
  return x.toLowerCase().replace(/[\s。、．，,.・「」『』（）()？！?!…〜ー]/g, "");
}
function bigrams(x) { const g = new Set(); for (let i = 0; i < x.length - 1; i++) g.add(x.slice(i, i + 2)); return g; }
function jaSim(a, b) {
  a = normJa(a); b = normJa(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.includes(b) || b.includes(a)) return 0.9;
  const A = bigrams(a), B = bigrams(b);
  let hit = 0; A.forEach(g => { if (B.has(g)) hit++; });
  return hit / Math.max(1, Math.min(A.size, B.size));
}

const CAT_ALIAS = {
  shopping: ["買い物", "かいもの", "ショッピング"],
  friends: ["友達との会話", "友達", "ともだち", "友達との"],
  work: ["職場でのやり取り", "職場", "しょくば", "仕事"],
  travel: ["旅行", "りょこう"],
  hospital: ["病院", "びょういん"],
};

function findCategory(raw) {
  const q = normJa(raw.replace(/(に|へ)?(移動して|移動|行って|開いて|して)$/, ""));
  if (!q) return null;
  for (const c of DATA) {
    const names = [c.name].concat(CAT_ALIAS[c.id] || []);
    if (names.some(n => normJa(n) === q)) return c;
  }
  for (const c of DATA) {
    const names = [c.name].concat(CAT_ALIAS[c.id] || []);
    if (names.some(n => jaSim(q, n) >= 0.7)) return c;
  }
  return null;
}

function findScene(raw) {
  const q = raw.replace(/(が|を)?(やりたい|したい)(です)?$/, "")
               .replace(/(を)?(開いて|お願いします|お願い|やって|して)$/, "");
  if (normJa(q).length < 2) return null;
  let best = null;
  DATA.forEach(c => c.scenes.forEach(sc => {
    const score = jaSim(q, sc.name) + (c.id === view.cat ? 0.05 : 0);
    if (!best || score > best.score) best = { cat: c.id, scene: sc.id, name: sc.name, score };
  }));
  return best && best.score >= 0.3 ? best : null;
}

function nextSceneAfter(catId, sceneId) {
  const c = DATA.find(x => x.id === catId);
  if (!c) return null;
  const i = c.scenes.findIndex(sc => sc.id === sceneId);
  return (i >= 0 && i + 1 < c.scenes.length) ? c.scenes[i + 1] : null;
}

function runPendingScene(pn) {
  view = { page: "dialogue", cat: pn.cat, scene: pn.scene, q: "" };
  render();
  speakJa(pn.name + "を始めます。", () => {
    if (view.page === "dialogue" && view.scene === pn.scene) startPractice();
  });
}

// ---- 練習中の共通アクション（日本語・英語コマンドの両方から使う） ----
function curTurn() { return practice ? currentScene().turns[practice.idx] : null; }
function prevPartnerTurn() {
  if (!practice) return null;
  const turns = currentScene().turns;
  for (let i = Math.min(practice.idx, turns.length - 1); i >= 0; i--) {
    if (turns[i].s === "p") return turns[i];
  }
  return null;
}
function asAnswer() {   // 答えの英文を開示して読み上げる
  const t = curTurn(); if (!t) return;
  const el = $("en" + practice.idx); if (el) el.classList.remove("hidden-text");
  speak(t.en);
}
function asHint() {     // 最初の3語だけ読む（思い出しの取っかかり）
  const t = curTurn(); if (!t) return;
  speak(t.en.split(/\s+/).slice(0, 3).join(" "));
}
function asJapanese() { // 直前の相手のセリフ（質問）を日本語で読む
  const pp = prevPartnerTurn(); const t = curTurn();
  const ja = pp ? pp.ja : (t ? t.ja : "");
  if (ja) speakJa(ja);
}
function asRepeat() {   // 相手のセリフをもう一度
  const pp = prevPartnerTurn();
  if (pp) speak(pp.en);
}
function syncRateUI() {
  const r = $("rngRate"); if (r) { r.value = settings.rate; $("rateVal").textContent = settings.rate; }
}
function asSlower() {
  settings.rate = Math.max(0.6, +(settings.rate - 0.15).toFixed(2));
  saveSettings(); syncRateUI();
  speakJa("少しゆっくりにしました。", () => { if (practice) asRepeat(); });
}
function asFaster() {
  settings.rate = Math.min(1.2, +(settings.rate + 0.15).toFixed(2));
  saveSettings(); syncRateUI();
  speakJa("少し速くしました。", () => { if (practice) asRepeat(); });
}

// ---- 日本語コマンド ----
function handleJaCommand(heard) {
  showAsHeard("🎙 " + heard);
  const q = normJa(heard);
  if (!q) return;

  // 確認待ちへの返事
  if (asPending && Date.now() - asPendingAt < 30000) {
    if (/^(はい|うん|おっけ|オッケ|ok|おけ|おねがい|お願い|やる|進んで|すすんで|開始|スタート)/.test(q)) {
      const pn = asPending; asPending = null; updateAsBar();
      runPendingScene(pn);
      return;
    }
    if (/^(いいえ|いえ|やめ|キャンセル|ちがう|違う|しない)/.test(q)) {
      asPending = null; updateAsBar();
      speakJa("取り消しました。");
      return;
    }
    asPending = null; updateAsBar();   // 返事以外なら確認を破棄して通常コマンドへ
  }

  // 次のシーン（練習中でも使えるよう、練習コマンドより先に判定）
  if (/次のシーン|つぎのシーン/.test(heard)) {
    const c = DATA.find(x => x.id === view.cat);
    const nx = view.scene ? nextSceneAfter(view.cat, view.scene) : (c ? c.scenes[0] : null);
    if (practice) stopPractice(false);
    if (nx) {
      asPending = { cat: view.cat, scene: nx.id, name: nx.name };
      asPendingAt = Date.now(); updateAsBar();
      speakJa("次は、" + nx.name + "、です。進みますか？");
    } else {
      speakJa(c ? "このカテゴリのシーンはこれで最後です。" : "先にカテゴリを開いてください。");
    }
    return;
  }

  // 練習中（マイク判定オフのとき）の日本語コマンド
  if (practice && handlePracticeJa(q)) return;

  if (/^(もどる|戻る|もどって|戻って)$/.test(q)) {
    backBtn.click();
    return;
  }
  if (/^(開始|かいし|スタート|すたーと|はじめて|始めて|練習開始)$/.test(q)) {
    if (view.page === "dialogue") speakJa("始めます。", () => startPractice());
    else speakJa("先にシーンを選んでください。");
    return;
  }
  if (/思い出すモード|日本語から/.test(q)) {
    settings.mode = "hide"; saveSettings();
    if (view.page === "dialogue") render();
    speakJa("日本語から思い出すモードにしました。");
    return;
  }
  if (/英文を見る|見て読むモード|表示モード/.test(q)) {
    settings.mode = "show"; saveSettings();
    if (view.page === "dialogue") render();
    speakJa("英文を見て読むモードにしました。");
    return;
  }
  if (/マイク判定.*(オン|おん|つけて|有効)/.test(q)) {
    settings.mic = true; saveSettings();
    const c = $("chkMic"); if (c) c.checked = true;
    speakJa("マイク判定をオンにしました。");
    return;
  }
  if (/マイク判定.*(オフ|おふ|切って|無効)/.test(q)) {
    settings.mic = false; saveSettings();
    const c = $("chkMic"); if (c) c.checked = false;
    speakJa("マイク判定をオフにしました。");
    return;
  }
  if (/^(ゆっくり|おそく|遅く)/.test(q)) { asSlower(); return; }
  if (/^(はやく|早く|速く)/.test(q)) { asFaster(); return; }

  // カテゴリ名
  const cat = findCategory(heard);
  if (cat) {
    view = { page: "scenes", cat: cat.id, q: "" };
    render();
    speakJa(cat.name + "を開きました。シーン名をどうぞ。");
    return;
  }

  // シーン名の検索 →「これでいいですか」の確認
  const hit = findScene(heard);
  if (hit) {
    asPending = { cat: hit.cat, scene: hit.scene, name: hit.name };
    asPendingAt = Date.now(); updateAsBar();
    speakJa(hit.name + "、でよろしいですか？");
    return;
  }
  // 「やりたい」等の意図があるのに見つからなかったときだけ返事する（雑音に反応しない）
  if (/やりたい|したい|開いて|お願い/.test(heard)) {
    speakJa("見つかりませんでした。別の言い方でどうぞ。");
  }
}

function handlePracticeJa(q) {
  if (/わからない|分からない|答え|こたえ|ギブアップ/.test(q)) { asAnswer(); return true; }
  if (/ヒント|ひんと/.test(q)) { asHint(); return true; }
  if (/日本語|にほんご|訳して|やくして|どういう意味/.test(q)) { asJapanese(); return true; }
  if (/もう一度|もういちど|もっかい|繰り返/.test(q)) { asRepeat(); return true; }
  if (/^(つぎ|次|次へ|スキップ|すきっぷ)$/.test(q)) { $("btnNext").click(); return true; }
  if (/^(最初から|さいしょから|やり直し|やりなおし)$/.test(q)) { startPractice(); return true; }
  if (/終了|しゅうりょう|やめる|やめて|ストップ|停止/.test(q)) {
    stopPractice(false); speakJa("練習を終了しました。"); return true;
  }
  if (/ゆっくり/.test(q)) { asSlower(); return true; }
  if (/速く|早く|はやく/.test(q)) { asFaster(); return true; }
  return false;
}

// ---- 英語コマンド（マイク判定オンの自分のターン中。完全一致のみ） ----
function handleEnCommand(saidRaw, t) {
  const x = saidRaw.toLowerCase().replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim();
  const next = () => $("btnNext").click();
  const stop = () => { stopPractice(false); speakJa("練習を終了しました。"); };
  const table = {
    "i don't know": asAnswer, "i dont know": asAnswer, "help": asAnswer, "help me": asAnswer,
    "i give up": asAnswer, "answer": asAnswer, "answer please": asAnswer,
    "the answer": asAnswer, "play the answer": asAnswer,
    "hint": asHint, "hint please": asHint, "give me a hint": asHint,
    "in japanese": asJapanese, "japanese": asJapanese, "japanese please": asJapanese,
    "translate": asJapanese, "translation": asJapanese,
    "one more time": asRepeat, "repeat": asRepeat, "repeat please": asRepeat,
    "again": asRepeat, "say that again": asRepeat,
    "slower": asSlower, "slower please": asSlower, "speak slower": asSlower,
    "faster": asFaster, "speak faster": asFaster,
    "next": next, "next please": next, "skip": next,
    "stop": stop, "stop practice": stop, "finish": stop,
    "start over": () => startPractice(),
  };
  if (table[x]) { showAsHeard("🎙 " + saidRaw); table[x](); return true; }
  const m = x.match(/^what does (.+) mean$/) || x.match(/^what's (.+)$/) ||
            x.match(/^what is (.+)$/) || x.match(/^meaning of (.+)$/);
  if (m) { showAsHeard("🎙 " + saidRaw); asDefine(m[1]); return true; }
  return false;
}

function asDefine(term) {
  const key = norm(term.trim());
  let e = dictReady ? PHRASES[key] : null;
  if (!e && dictReady) {
    const lem = key.split(" ").map(phLemma).join(" ");
    e = PHRASES[lem];
  }
  if (!e && dictReady && key.split(" ").length === 1) {
    const f = lookupWord(key);
    if (f) e = f.e;
  }
  if (e) speakJa(term + "。" + e[0]);
  else speakJa("辞書に見つかりませんでした。画面の単語をタップすると意味が出ます。");
}

// ボタンで明示的にオンにする（マイクを勝手に開かないため、状態は保存しない）
$("asBtn").onclick = () => {
  unlockTTS();
  if (!micAvailable()) { showAsHeard("⚠ このブラウザは音声認識に対応していません"); return; }
  setAssistant(!assistantOn);
  if (assistantOn) speakJa("音声操作をオンにしました。");
};

// ---- 画面描画 ----
function render() {
  speechSynthesis.cancel();
  hideTip();
  updateAsBar();
  if (view.page === "home") renderHome();
  else if (view.page === "scenes") renderScenes();
  else renderDialogue();
}

function renderHome() {
  backBtn.style.display = "none";
  crumb.textContent = "カテゴリを選んでください";
  panel.classList.remove("show");
  const counts = store.get("counts", {});
  // file:// で開くとブラウザがマイクの許可を保存できず、開くたびに聞かれる
  const fileNote = (location.protocol === "file:") ? `
    <div class="note">
      <b>マイクの許可が毎回聞かれる状態です。</b>
      このファイルを直接開くと（file://）、ブラウザは許可を保存できません。<br>
      同じフォルダの <b>「英会話練習を開く」</b>（ショートカット）から開き直すと
      <b>http://localhost:8765</b> で表示され、最初に一度
      「サイトへのアクセス時は許可」を選ぶだけで以降は聞かれなくなります。
    </div>` : "";
  main.innerHTML = fileNote + `<div class="grid">` + DATA.map(c => `
    <div class="tile" onclick="openCategory('${c.id}')">
      <div class="emoji">${c.emoji}</div>
      <div class="name">${c.name}</div>
      <div class="desc">${c.desc}</div>
      <div class="meta">${c.scenes.length} シーン ・ 練習 ${c.scenes.reduce((a,s)=>a+(counts[c.id+"/"+s.id]||0),0)} 回</div>
    </div>`).join("") + `</div>`;
}

function renderScenes() {
  const cat = DATA.find(c => c.id === view.cat);
  backBtn.style.display = "";
  crumb.textContent = cat.emoji + " " + cat.name;
  panel.classList.remove("show");

  // シーンが多いカテゴリは縦に長くなり探しにくいので、絞り込み欄を出す
  const needFilter = cat.scenes.length >= 10;
  const bar = needFilter ? `
    <div class="filter-bar">
      <span>🔍</span>
      <input id="sceneFilter" type="search" placeholder="シーン名で絞り込む（例：入国、予約、注文）"
             value="${esc(view.q || "")}" autocomplete="off">
      <span class="count" id="filterCount"></span>
      <button class="clear" id="filterClear">消す</button>
    </div>` : "";

  main.innerHTML = bar + `<div class="grid" id="sceneGrid"></div><div id="filterEmpty"></div>`;
  drawSceneTiles();

  if (needFilter) {
    const inp = $("sceneFilter");
    inp.oninput = () => { view.q = inp.value; drawSceneTiles(); };
    $("filterClear").onclick = () => { view.q = ""; inp.value = ""; inp.focus(); drawSceneTiles(); };
  }
}

// 絞り込み結果でタイルを描き直す（一覧そのものは作り直さないので入力欄の状態が保たれる）
function drawSceneTiles() {
  const cat = DATA.find(c => c.id === view.cat);
  const counts = store.get("counts", {});
  const q = (view.q || "").trim().toLowerCase();
  const hit = cat.scenes.filter(s => !q || s.name.toLowerCase().includes(q));

  $("sceneGrid").innerHTML = hit.map(s => {
    const n = counts[cat.id + "/" + s.id] || 0;
    return `
    <div class="tile" onclick="openScene('${s.id}')">
      <div class="name">${esc(s.name)}</div>
      <div class="desc">${s.turns.length} 往復のやり取り</div>
      <div class="meta">${n > 0 ? `<span class="done-badge">✔ ${n} 回練習済み</span>` : "未練習"}</div>
    </div>`;
  }).join("");

  const cnt = $("filterCount");
  if (cnt) cnt.textContent = q ? `${hit.length} / ${cat.scenes.length} 件` : `${cat.scenes.length} 件`;
  const empty = $("filterEmpty");
  if (empty) empty.innerHTML = (q && hit.length === 0)
    ? `<div class="filter-empty">「${esc(q)}」に一致するシーンはありません。</div>` : "";
}

function renderDialogue() {
  const cat = DATA.find(c => c.id === view.cat);
  const scene = cat.scenes.find(s => s.id === view.scene);
  backBtn.style.display = "";
  crumb.textContent = `${cat.emoji} ${cat.name} ＞ ${scene.name}`;

  const micNote = micAvailable() ? "" :
    `<div class="note"><b>このブラウザは音声認識に対応していないため、マイク判定は使えません。</b>
      iPhone の Chrome は非対応です（iOS の制約）。iPhone では Safari、PCでは Edge / Chrome なら使えます。<br>
      このままでも、英文を声に出して読んでから「言えた → 次へ」を押す形で練習できます。</div>`;
  const dictNote = dictReady ? "" :
    `<div class="note">辞書ファイル（dictionary.js）が読み込めていないため、単語の意味は表示されません。index.html と同じフォルダに dictionary.js を置いてください。</div>`;

  main.innerHTML = `
    ${micNote}${dictNote}
    <div class="toolbar">
      <button class="btn btn-primary" id="btnStart">▶ 会話を開始</button>
      <label>自分のセリフ：
        <select id="selMode">
          <option value="show" ${settings.mode==="show"?"selected":""}>英文を見て読む</option>
          <option value="hide" ${settings.mode==="hide"?"selected":""}>日本語から思い出す（英文を隠す）</option>
        </select>
      </label>
      <label><input type="checkbox" id="chkMic" ${settings.mic && micAvailable() ? "checked":""} ${micAvailable()?"":"disabled"}> マイクで判定する</label>
      <label>話す速さ <input type="range" id="rngRate" min="0.6" max="1.2" step="0.05" value="${settings.rate}"> <span id="rateVal">${settings.rate}</span></label>
    </div>
    <div class="colhead">
      <div>${TOUCH
        ? `英語（単語をタップ＝意味／文の余白をタップ＝読み上げ・<span style="color:#7c3aed">紫＝熟語</span>）`
        : `英語（クリックで読み上げ・<span style="color:#7c3aed">紫の下線＝熟語</span>／点線＝単語 にマウスを当てると意味）`}</div>
      <div>日本語訳</div>
    </div>
    <div id="turns">` +
    scene.turns.map((t, i) => {
      const who = t.s === "p" ? "相手" : "あなた";
      const hide = t.s === "m" && settings.mode === "hide";
      return `
      <div class="turn ${t.s === "p" ? "partner" : "me"}" id="turn${i}">
        <div class="cell en" onclick="cellClick(${i})">
          <span class="speaker">${who}</span>
          <span class="en-text ${hide ? "hidden-text" : ""}" id="en${i}">${markup(t.en)}</span>
          ${hide ? `<span class="revealTag">（クリックで表示）</span>` : ""}
        </div>
        <div class="cell ja"><span class="speaker">&nbsp;</span>${t.ja}</div>
      </div>`;
    }).join("") + `</div><div style="height:120px"></div>`;

  $("btnStart").onclick = startPractice;
  $("selMode").onchange = (e) => { settings.mode = e.target.value; saveSettings(); render(); };
  $("chkMic").onchange = (e) => {
    settings.mic = e.target.checked;
    saveSettings();
    // 練習中に切り替えたら、その場で聞き取りを止める／始める
    if (!settings.mic) {
      stopListening();
    } else if (practice) {
      const t = currentScene().turns[practice.idx];
      if (t && t.s === "m") beginMyTurn(t);
    }
  };
  $("rngRate").oninput = (e) => { settings.rate = +e.target.value; $("rateVal").textContent = e.target.value; saveSettings(); };
}

function saveSettings() { store.set("settings", settings); }

// ---- 画面遷移 ----
window.openCategory = (id) => { view = { page: "scenes", cat: id, q: "" }; render(); };
// 絞り込みの入力（q）を持ち回す。落とすと「戻る」で絞り込みが消える
window.openScene = (id) => { view = { page: "dialogue", cat: view.cat, scene: id, q: view.q }; render(); };
backBtn.onclick = () => {
  stopPractice(false);
  if (view.page === "dialogue") view = { page: "scenes", cat: view.cat, q: view.q };
  else view = { page: "home" };
  render();
};

window.cellClick = (i) => {
  unlockTTS();
  const scene = currentScene();
  const t = scene.turns[i];
  const el = $("en" + i);
  if (el.classList.contains("hidden-text")) { el.classList.remove("hidden-text"); return; }
  if (!practice) speak(t.en);
};

function currentScene() {
  return DATA.find(c => c.id === view.cat).scenes.find(s => s.id === view.scene);
}

// ============================================================
// 練習フロー
// ============================================================
function startPractice() {
  unlockTTS();            // 「会話を開始」のタップの中で読み上げを解禁する（iOS 対策）
  stopPractice(false);
  hideTip();
  practice = { idx: 0, autoTimer: null };
  panel.classList.add("show");
  playTurn();
}

function stopPractice(finished) {
  ttsToken++;            // 進行中の読み上げの通知を無効化する
  speechSynthesis.cancel();
  ttsBusy = false;
  partnerPending = null;
  stopListening();
  if (practice && practice.autoTimer) clearTimeout(practice.autoTimer);
  practice = null;
  panel.classList.remove("show");
  document.querySelectorAll(".turn.active").forEach(el => el.classList.remove("active"));
  if (finished) {
    const key = view.cat + "/" + view.scene;
    const counts = store.get("counts", {});
    counts[key] = (counts[key] || 0) + 1;
    store.set("counts", counts);
    render();
    const done = document.createElement("div");
    done.className = "note";
    done.style.cssText = "background:#dcfce7;border-color:#86efac;color:#166534";
    done.innerHTML = "🎉 会話を最後まで練習しました！";
    main.prepend(done);
    setTimeout(() => done.remove(), 6000);

    // 音声操作がオンなら、次のシーンへ進むか声で確認する
    if (assistantOn) {
      const nx = nextSceneAfter(view.cat, view.scene);
      if (nx) {
        asPending = { cat: view.cat, scene: nx.id, name: nx.name };
        asPendingAt = Date.now(); updateAsBar();
        speakJa("お疲れさまでした。次のシーン、" + nx.name + "、に進みますか？");
      } else {
        speakJa("お疲れさまでした。このカテゴリのシーンはこれで最後です。");
      }
    }
  }
}

function highlight(i) {
  document.querySelectorAll(".turn.active").forEach(el => el.classList.remove("active"));
  const el = $("turn" + i);
  if (el) { el.classList.add("active"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

function playTurn() {
  if (!practice) return;
  const scene = currentScene();
  if (practice.idx >= scene.turns.length) { stopPractice(true); return; }
  const t = scene.turns[practice.idx];
  highlight(practice.idx);
  $("recognized").innerHTML = "";

  if (t.s === "p") {
    setStatus("🔊 相手が話しています…");
    setBtns({ replay: false, answer: false, reveal: false, retry: false, next: false });
    const myIdx = practice.idx;
    partnerPending = null;          // この読み上げ自体を読み直し対象にしないため先に消す
    speak(t.en, () => {
      if (!practice || practice.idx !== myIdx) return;
      partnerPending = null;        // 最後まで読めたので読み直しは不要
      practice.autoTimer = setTimeout(() => { practice.idx++; playTurn(); }, 500);
    });
    partnerPending = myIdx;         // ここから先に割り込まれたら読み直す
  } else {
    beginMyTurn(t);
  }
}

function beginMyTurn(t) {
  partnerPending = null;
  const hidden = settings.mode === "hide";
  setBtns({ replay: true, answer: true, reveal: hidden, retry: true, next: true });
  if (settings.mic && micAvailable()) {
    setStatus(`<span class="mic-on">🗣 あなたの番です。英語で話してください（待っている間も、単語を調べている間も聞き取りは続きます）</span>`);
    micWanted = true;
    micTurn = t;
    micSince = Date.now();
    micFails = 0;
    startListening();
  } else {
    stopListening();   // 判定オフのときに前のターンの聞き取りが残らないように止める
    setStatus("🗣 あなたの番です。英文を声に出して読んだら「言えた → 次へ」を押してください");
  }
}

function showFeedback(said, t) {
  const model = tokenize(t.en);
  const saidW = tokenize(said);
  const saidSet = new Set(saidW);
  const hit = model.filter(w => saidSet.has(w)).length;
  const score = model.length ? Math.round(hit / model.length * 100) : 0;

  // 認識結果を、模範文に含まれる単語=緑 / 含まれない=赤 で表示
  const modelSet = new Set(model);
  const colored = saidW.map(w => `<span class="${modelSet.has(w) ? "w-ok" : "w-ng"}">${w}</span>`).join(" ");
  const badge = `<span id="scoreBadge" class="${score >= 70 ? "score-high" : "score-low"}">一致 ${score}%</span>`;
  $("recognized").innerHTML = `あなた：「${colored}」 ${badge}`;

  // 隠しモードなら答えを開示
  const el = $("en" + practice.idx);
  if (el) el.classList.remove("hidden-text");

  if (score >= 70) {
    stopListening();   // 直後に相手が話すので、その声を拾わないよう止める
    setStatus("✅ よく言えています！自動で次に進みます…");
    setBtns({ replay: false, answer: true, reveal: false, retry: true, next: true });
    practice.autoTimer = setTimeout(() => { practice.idx++; playTurn(); }, 2200);
  } else {
    setStatus("🔁 模範文と少し違いました。答えを確認して、もう一度話すか次へ進んでください");
    setBtns({ replay: true, answer: true, reveal: false, retry: true, next: true });
  }
}

function tokenize(s) {
  return s.toLowerCase().replace(/[^a-z0-9' ]/g, " ").split(/\s+/).filter(Boolean);
}

function setStatus(html) { $("panelStatus").innerHTML = html; }
function setBtns(v) {
  $("btnReplay").style.display = v.replay ? "" : "none";
  $("btnAnswerVoice").style.display = v.answer ? "" : "none";
  $("btnReveal").style.display = v.reveal ? "" : "none";
  $("btnRetry").style.display = v.retry ? "" : "none";
  $("btnNext").style.display = v.next ? "" : "none";
}

// パネルのボタン
$("btnReplay").onclick = () => {
  const scene = currentScene();
  const prev = scene.turns[practice.idx - 1];
  if (prev && prev.s === "p") speak(prev.en);
};
$("btnAnswerVoice").onclick = () => {
  const t = currentScene().turns[practice.idx];
  const el = $("en" + practice.idx);
  if (el) el.classList.remove("hidden-text");
  speak(t.en);
};
$("btnReveal").onclick = () => {
  const el = $("en" + practice.idx);
  if (el) el.classList.remove("hidden-text");
};
$("btnRetry").onclick = () => {
  if (practice.autoTimer) clearTimeout(practice.autoTimer);
  const t = currentScene().turns[practice.idx];
  $("recognized").innerHTML = "";
  beginMyTurn(t);
};
$("btnNext").onclick = () => {
  stopListening();
  if (practice.autoTimer) clearTimeout(practice.autoTimer);
  practice.idx++;
  playTurn();
};
$("btnStop").onclick = () => stopPractice(false);

render();
</script>
</body>
</html>
