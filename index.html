<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英会話ロールプレイ</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1f2937;
    --sub: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --partner: #f1f5f9;
    --me: #eff6ff;
    --ok: #16a34a;
    --ng: #dc2626;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* キーボード操作でも今どこにいるか分かるように */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 動きを減らす設定にしている人には点滅・変化を出さない */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  body {
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
    background: var(--bg); color: var(--ink);
    line-height: 1.6;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  #backBtn {
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 14px;
  }
  #backBtn:hover { background: var(--accent-soft); }
  #crumb { color: var(--sub); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }

  /* ---- カテゴリ・シーン一覧 ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .tile {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; cursor: pointer; transition: box-shadow .15s, transform .15s;
  }
  .tile:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); transform: translateY(-2px); }
  .tile .emoji { font-size: 30px; }
  .tile .name { font-weight: 700; font-size: 16px; margin-top: 8px; }
  .tile .desc { color: var(--sub); font-size: 13px; margin-top: 4px; }
  .tile .meta { color: var(--accent); font-size: 12px; margin-top: 8px; }

  /* ---- 会話画面 ---- */
  .toolbar {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  }
  .toolbar label { font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .toolbar select, .toolbar input[type=range] { font-size: 13px; }
  .btn {
    border: none; border-radius: 8px; padding: 9px 20px; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { background: var(--card); border: 1px solid var(--border); color: var(--ink); }
  .btn-ghost:hover { background: var(--accent-soft); }
  .btn:disabled { opacity: .45; cursor: default; }

  .colhead {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    font-size: 12px; color: var(--sub); font-weight: 700;
    padding: 0 6px 6px;
  }
  .turn {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 10px; border-radius: 12px; padding: 6px;
    border: 2px solid transparent;
  }
  .turn.active { border-color: var(--accent); background: #fff; box-shadow: 0 2px 10px rgba(37,99,235,.15); }
  .cell {
    border-radius: 10px; padding: 10px 14px; font-size: 15px;
    background: var(--card); border: 1px solid var(--border);
  }
  .turn.partner .cell.en { background: var(--partner); }
  .turn.me .cell.en { background: var(--me); }
  .cell .speaker { font-size: 11px; font-weight: 700; color: var(--sub); display: block; margin-bottom: 2px; }
  .turn.me .cell .speaker { color: var(--accent); }
  .cell.ja { color: #374151; font-size: 14px; }
  .cell.en { cursor: pointer; }
  .cell.en:hover { outline: 2px solid var(--accent-soft); }
  .en-text.hidden-text {
    filter: blur(6px); user-select: none; transition: filter .2s;
  }
  .turn .revealTag { font-size: 11px; color: var(--accent); margin-left: 6px; }

  /* 練習パネル */
  #panel {
    position: sticky; bottom: 0; background: var(--card);
    border-top: 2px solid var(--accent); padding: 14px 20px;
    display: none; z-index: 10; box-shadow: 0 -4px 16px rgba(0,0,0,.08);
  }
  #panel.show { display: block; }
  #panelInner { max-width: 1100px; margin: 0 auto; }
  #panelStatus { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  #panelStatus .mic-on { color: var(--ng); }
  #micState { font-size: 12.5px; min-height: 18px; margin: 2px 0 4px; }
  #micState .mic-live { color: var(--ng); font-weight: 700; animation: micblink 1.4s infinite; }
  #micState .mic-idle { color: var(--sub); }
  @keyframes micblink { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  #recognized { font-size: 15px; min-height: 24px; margin-bottom: 8px; }
  #recognized .w-ok { color: var(--ok); font-weight: 600; }
  #recognized .w-ng { color: var(--ng); }
  #scoreBadge {
    display: inline-block; border-radius: 999px; padding: 2px 12px;
    font-size: 13px; font-weight: 700; margin-left: 8px;
  }
  .score-high { background: #dcfce7; color: var(--ok); }
  .score-low { background: #fee2e2; color: var(--ng); }
  #panelBtns { display: flex; gap: 10px; flex-wrap: wrap; }

  /* シーンが多いカテゴリ用の絞り込み欄 */
  .filter-bar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px;
    /* シーンが100本あると縦に長いので、スクロールしても常に絞り込めるよう貼り付ける */
    position: sticky; top: 8px; z-index: 9;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .filter-bar input {
    flex: 1; border: none; outline: none; font-size: 15px;
    background: transparent; color: var(--ink); min-width: 0;
  }
  .filter-bar input::placeholder { color: var(--sub); }
  .filter-bar .count { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .filter-bar .clear {
    border: none; background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  .filter-empty { color: var(--sub); font-size: 14px; padding: 8px 4px; }

  .note {
    background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; color: #92400e; margin-bottom: 16px;
  }
  .done-badge { color: var(--ok); font-weight: 700; }

  /* ---- 音声アシスタント ---- */
  #asBtn {
    margin-left: auto; border: 1px solid var(--border); background: var(--card);
    color: var(--ink); border-radius: 999px; padding: 6px 14px;
    cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  #asBtn.on { background: var(--ng); color: #fff; border-color: var(--ng); }
  #asBar {
    display: none; background: #eef2ff; border-bottom: 1px solid #c7d2fe;
    padding: 6px 20px; font-size: 12.5px; color: #3730a3;
  }
  #asBar.show { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  #asBar.jahelp { background: #fef3c7; border-bottom-color: #fcd34d; color: #92400e; }
  #hintBox {
    display: none; margin: 4px 0 8px; padding: 9px 13px; font-size: 14px;
    background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; color: #92400e;
  }
  #hintBox.show { display: block; }
  #hintBox .skel { font-size: 16px; letter-spacing: .5px; color: #1f2937; font-weight: 700; }
  #hintBox .lv { font-size: 11px; font-weight: 700; color: #b45309; }

  /* ---- 単語・熟語の学習 ---- */
  .vocab-top {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 14px;
  }
  .vocab-top:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .vocab-top .emoji { font-size: 28px; }
  .vocab-top .name { font-weight: 700; font-size: 16px; }
  .vocab-top .desc { color: var(--sub); font-size: 13px; margin-top: 2px; }

  /* ---- AI 連携 ---- */
  .ai-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--sub); margin-bottom: 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 14px;
  }
  .ai-row .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
  .ai-row .dot.on { background: var(--ok); }
  .ai-row button {
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .ai-row button:hover { background: var(--accent-soft); }
  .ai-form { display: grid; gap: 8px; margin-top: 8px; width: 100%; }
  .ai-form label { display: grid; gap: 3px; font-size: 12px; }
  .ai-form input {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font-size: 14px; width: 100%; box-sizing: border-box;
  }
  .ai-form .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .ai-note { font-size: 11.5px; color: var(--sub); line-height: 1.5; }
  #aiState { font-size: 12.5px; min-height: 17px; margin: 2px 0 4px; color: #7c3aed; font-weight: 700; }

  .vbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
    font-size: 13px; color: var(--sub);
  }
  .vbar select { font-size: 13px; padding: 4px; }
  .vbar .stat { font-weight: 700; color: var(--ink); }
  .vbar .stat.ok { color: var(--ok); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 26px 22px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.05);
  }
  .card .kind {
    display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px;
    padding: 2px 10px; margin-bottom: 12px; background: var(--accent-soft); color: var(--accent);
  }
  .card .kind.ph { background: #ede9fe; color: #7c3aed; }
  .card .mean { font-size: 21px; font-weight: 700; line-height: 1.5; }
  .card .shape { color: var(--sub); font-size: 13px; margin-top: 10px; letter-spacing: 1px; }
  .card .ans { font-size: 27px; font-weight: 700; margin: 6px 0 4px; color: var(--accent); }
  .card .ex { color: #374151; font-size: 14px; margin-top: 10px; }
  .card .ex .ja { color: var(--sub); font-size: 13px; }
  .card .btns { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .card .btns .btn { min-width: 130px; }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-ng { background: #fef2f2; color: var(--ng); border: 1px solid #fecaca; }
  .vdone { text-align: center; padding: 30px 16px; }
  .vdone .big { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  @media (max-width: 720px) {
    .card { padding: 20px 14px; }
    .card .mean { font-size: 18px; }
    .card .ans { font-size: 23px; }
    .card .btns .btn { flex: 1 1 46%; min-width: 0; }
  }
  #asHeard { font-weight: 700; transition: opacity .4s; }
  @media (max-width: 720px) {
    #asBtn { padding: 8px 12px; font-size: 12px; }
    #asBar { padding: 6px 12px; }
  }

  /* ---- 単語ホバー辞書 ---- */
  .w { border-radius: 3px; padding: 0 1px; }
  .w.has { border-bottom: 1px dotted #9ca3af; cursor: help; }
  .w.has:hover { background: #fef3c7; border-bottom-color: #d97706; }
  .w.ph { border-bottom: 2px solid #c4b5fd; background: #f5f3ff; cursor: help; }
  .w.ph:hover { background: #e9d5ff; border-bottom-color: #7c3aed; }
  .hidden-text .w { border-bottom-color: transparent; background: none; cursor: default; }

  #tip {
    position: fixed; z-index: 100; display: none;
    max-width: 340px; background: #1f2937; color: #f9fafb;
    border-radius: 10px; padding: 10px 13px; font-size: 13px; line-height: 1.55;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
  }
  #tip.show { display: block; }
  .tip-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .tip-term { font-weight: 700; font-size: 15px; color: #fff; }
  .tip-tag {
    font-size: 10px; border-radius: 999px; padding: 1px 7px;
    background: #7c3aed; color: #fff; font-weight: 700;
  }
  .tip-tag.word { background: #2563eb; }
  .tip-say {
    margin-left: auto; background: #374151; border: none; color: #f9fafb;
    border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px;
  }
  .tip-say:hover { background: #4b5563; }
  .tip-mean { color: #fde68a; margin-bottom: 6px; }
  .tip-ex { border-top: 1px solid #374151; padding-top: 6px; font-size: 12.5px; }
  .tip-ex .en { color: #d1fae5; }
  .tip-ex .ja { color: #9ca3af; }
  .tip-chips { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tip-chip {
    background: #374151; border: none; color: #e5e7eb; border-radius: 999px;
    padding: 2px 9px; font-size: 11.5px; cursor: pointer;
  }
  .tip-chip:hover { background: #4b5563; color: #fff; }
  .tip-none { color: #9ca3af; }

  /* 画面が狭いときは、吹き出しを単語の近くではなく画面上部に固定して出す
     （指で触ると単語が指の下に隠れるため） */
  #tip.sheet {
    left: 8px; right: 8px; top: 8px; bottom: auto;
    max-width: none; font-size: 14px; padding: 13px 15px;
  }

  /* ---- スマホ・タブレット ---- */
  @media (max-width: 720px) {
    header { padding: 9px 12px; gap: 8px; }
    header h1 { font-size: 15px; }
    #crumb { font-size: 11.5px; }
    #backBtn { padding: 8px 12px; }
    main { padding: 12px; }

    .grid { grid-template-columns: 1fr; gap: 10px; }
    .tile { padding: 14px; }

    /* 英語と日本語を横並びから縦積みに変える */
    .turn { grid-template-columns: 1fr; gap: 3px; padding: 4px; }
    .cell { padding: 9px 12px; }
    .cell.ja {
      background: transparent; border: none;
      padding: 2px 12px 6px; font-size: 13px;
    }
    .cell.ja .speaker { display: none; }
    .colhead { grid-template-columns: 1fr; font-size: 11px; }
    .colhead div:last-child { display: none; }

    .toolbar { padding: 10px 12px; gap: 9px; }
    .toolbar label { width: 100%; }
    .toolbar select { flex: 1; padding: 6px; }
    .toolbar input[type=range] { flex: 1; }
    #btnStart { width: 100%; padding: 12px; font-size: 15px; }

    #panel { padding: 10px 12px; }
    #panelStatus { font-size: 13.5px; }
    #panelBtns { gap: 6px; }
    #panelBtns .btn { flex: 1 1 46%; padding: 11px 8px; font-size: 13px; }
  }

    /* フリー会話：話す代わりに書いて送る欄（マイクが使えない端末用・日本語の質問用） */
    #freeInputRow { display: none; gap: 8px; margin-top: 8px; }
    #freeInputRow.show { display: flex; }
    #freeInputRow input {
      flex: 1; min-width: 0; padding: 10px 12px; font-size: 14px;
      border: 1px solid #cbd5e1; border-radius: 8px;
    }
    #freeInputRow .btn { flex: 0 0 auto; padding: 10px 16px; font-size: 13px; }
    .free-wait { color: #7c3aed; font-weight: 700; }
    .free-tip { color: var(--ng); font-size: 13px; }
</style>
</head>
<body>

<header>
  <button id="backBtn" style="display:none">← 戻る</button>
  <h1>英会話ロールプレイ</h1>
  <span id="crumb"></span>
  <button id="asBtn" title="音声でアプリを操作する">🎙 音声操作</button>
</header>

<div id="asBar"><span id="asHeard"></span><span id="asHint"></span></div>

<main id="main"></main>

<div id="panel">
  <div id="panelInner">
    <div id="panelStatus"></div>
    <div id="micState"></div>
    <div id="aiState"></div>
    <div id="hintBox"></div>
    <div id="recognized"></div>
    <div id="panelBtns">
      <button class="btn btn-ghost" id="btnReplay">🔊 もう一度聞く</button>
      <button class="btn btn-ghost" id="btnAnswerVoice">🗣 答えの音声を聞く</button>
      <button class="btn btn-ghost" id="btnReveal">👀 答えの英文を見る</button>
      <button class="btn btn-ghost" id="btnRetry">🎤 もう一度話す</button>
      <button class="btn btn-primary" id="btnNext">言えた → 次へ ▶</button>
      <button class="btn btn-ghost" id="btnStop">■ 終了</button>
    </div>
    <div id="freeInputRow">
      <input id="freeInput" autocomplete="off"
             placeholder="書いて送る（日本語で質問してもOK：混雑してるって英語で？）">
      <button class="btn btn-primary" id="freeSendBtn">送る</button>
    </div>
  </div>
</div>

<div id="tip"></div>

<script>
/* --- dictionary.js を埋め込み（正本は dictionary.js） --- */
// ============================================================
// 単語・熟語辞書（index.html と同じフォルダに置いてください）
//
// 形式： "見出し語": ["意味", "例文(英語)", "例文の訳"]
// 単語を追加したいときは WORDS に、熟語は PHRASES に同じ形式で足すだけ。
// PHRASES は単語より優先して照合され、長い熟語から先に一致します。
// ============================================================

const PHRASES = {
  // --- 買い物 ---
  "hi there": ["やあ／いらっしゃいませ（くだけた挨拶）", "Hi there! How can I help you?", "いらっしゃいませ。何かお探しですか？"],
  "look for": ["〜を探す（探している最中）", "I'm looking for a jacket.", "ジャケットを探しています。"],
  "in particular": ["特に／具体的に", "Are you looking for anything in particular?", "何か特にお探しのものはありますか？"],
  "depend on": ["〜によって決まる／〜次第だ", "It depends on the brand.", "ブランドによって変わります。"],
  "come in": ["入荷する／入ってくる", "These just came in.", "これは入荷したばかりです。"],
  "would you like to": ["〜なさいますか（丁寧な誘い・勧め）", "Would you like to try it on?", "ご試着なさいますか？"],
  "would you like": ["〜はいかがですか（丁寧に希望を聞く）", "Would you like a bag?", "袋はご利用になりますか？"],
  "i'd like to": ["〜したいのですが（丁寧に希望を言う）", "I'd like to return this.", "これを返品したいのですが。"],
  "try on": ["試着する（try it on の語順に注意）", "Can I try this on?", "これを試着できますか？"],
  "try one on": ["（そのうちの）1つを試着する", "Would you like to try one on?", "1着ご試着なさいますか？"],
  "fitting room": ["試着室", "Where is the fitting room?", "試着室はどこですか？"],
  "right over there": ["すぐあちらです（場所を指して）", "It's right over there.", "すぐあちらにございます。"],
  "next to": ["〜の隣に", "It's next to the mirrors.", "鏡の隣です。"],
  "how does it fit": ["サイズはいかがですか（着心地を聞く）", "How does it fit?", "サイズ感はいかがですか？"],
  "a little": ["少し（形容詞の前に置いて和らげる）", "It's a little tight.", "少しきついです。"],
  "let me check": ["確認させてください（すぐ調べます）", "Let me check our stock.", "在庫を確認しますね。"],
  "here it is": ["これです（差し出すとき）", "Yes, here it is.", "はい、これです。"],
  "i'll take it":["これをください（購入を決めるときの定番）", "This one fits perfectly. I'll take it.", "これはぴったりです。これをください。"],
  "great choice": ["よいお選びです（店員の褒め言葉）", "Great choice!", "すてきなお買い物ですね。"],
  "cash or card": ["現金かカードか", "Will that be cash or card?", "お支払いは現金かカードどちらですか？"],
  "may i ask": ["お伺いしてもよいですか（丁寧に質問する）", "May I ask the reason?", "理由をお伺いしてもよろしいですか？"],
  "the reason for": ["〜の理由", "May I ask the reason for the return?", "返品の理由をお伺いできますか？"],

// アプリ本体
// ============================================================
const $ = (id) => document.getElementById(id);
const main = $("main");
const crumb = $("crumb");
const backBtn = $("backBtn");
const panel = $("panel");

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("eikaiwa_" + k)) ?? d; } catch { return d; } },
  set(k, v) {
    // 埋め込み表示などで保存が禁止されている場合があるので、失敗しても止めない
    try { localStorage.setItem("eikaiwa_" + k, JSON.stringify(v)); } catch {}
  },
};

let view = { page: "home" };          // home | scenes | dialogue
let practice = null;                   // 練習中の状態
let settings = store.get("settings", { mode: "show", mic: true, rate: 0.95 });

// ============================================================
// 単語・熟語のホバー辞書（辞書データは dictionary.js）
// ============================================================
const dictReady = (typeof WORDS === "object" && typeof PHRASES === "object");

// 熟語を照合するときだけ使う活用そろえ（looking for → look for と当てるため）
const PH_LEMMA = {
  "looking":"look","looked":"look","looks":"look",
  "going":"go","goes":"go","went":"go",
  "came":"come","comes":"come","coming":"come",
  "got":"get","gets":"get","getting":"get",
  "made":"make","makes":"make","making":"make",
  "trying":"try","tried":"try","tries":"try",
  "waiting":"wait","waited":"wait","waits":"wait",
  "checking":"check","checked":"check","checks":"check",
  "changed":"change","changing":"change","changes":"change",
  "heard":"hear","hears":"hear","hearing":"hear",
  "asked":"ask","asks":"ask","asking":"ask",
  "depends":"depend","depended":"depend","depending":"depend",
  "turned":"turn","turning":"turn","turns":"turn",
  "grabbed":"grab","grabs":"grab","grabbing":"grab",
  "caught":"catch","catches":"catch","catching":"catch",
  "extended":"extend","extends":"extend",
  "followed":"follow","follows":"follow","following":"follow",
  "fits":"fit","fitted":"fit","fitting":"fit",
  "took":"take","takes":"take","taking":"take",
  "sent":"send","sends":"send","sending":"send",
  "wore":"wear","wears":"wear","wearing":"wear",
  "moved":"move","moves":"move"
};

const PHRASE_LIST = dictReady
  ? Object.keys(PHRASES).map(k => k.split(" ").length)
  : [];
const MAX_PHRASE_LEN = PHRASE_LIST.length ? Math.max.apply(null, PHRASE_LIST) : 0;
const PHRASE_SET = new Set(dictReady ? Object.keys(PHRASES) : []);

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function norm(w) { return w.toLowerCase().replace(/’/g, "'"); }
function phLemma(w) { return PH_LEMMA[w] || w; }

// 単語を引く（活用形からも原形にたどる）
function lookupWord(w) {
  if (!dictReady) return null;
  const k = norm(w);
  if (WORDS[k]) return { key: k, e: WORDS[k] };
  const m = (typeof LEMMA_MAP === "object") ? LEMMA_MAP[k] : null;
  if (m && WORDS[m]) return { key: m, e: WORDS[m] };
  const cands = [];
  if (/ies$/.test(k)) cands.push(k.slice(0, -3) + "y");
  if (/(es|ed)$/.test(k)) cands.push(k.slice(0, -2), k.slice(0, -1));
  if (/s$/.test(k)) cands.push(k.slice(0, -1));
  if (/ing$/.test(k)) cands.push(k.slice(0, -3), k.slice(0, -3) + "e");
  const dbl = k.match(/^(.*?)([a-z])\2(ed|ing)$/);
  if (dbl) cands.push(dbl[1] + dbl[2]);
  for (const c of cands) if (WORDS[c]) return { key: c, e: WORDS[c] };
  return null;
}

// 英文を、単語・熟語ごとにホバーできる span 付きHTMLに変換する
const WORD_RE = /[A-Za-z]+(?:['’-][A-Za-z]+)*/g;
function markup(text) {
  if (!dictReady) return esc(text);
  const toks = [];
  let m;
  WORD_RE.lastIndex = 0;
  while ((m = WORD_RE.exec(text)) !== null) toks.push({ w: m[0], s: m.index, e: m.index + m[0].length });

  let out = "", pos = 0, i = 0;
  while (i < toks.length) {
    out += esc(text.slice(pos, toks[i].s));
    // 熟語は長いものから優先して照合する
    let hit = null;
    for (let n = Math.min(MAX_PHRASE_LEN, toks.length - i); n >= 2; n--) {
      const seg = toks.slice(i, i + n).map(t => norm(t.w));
      const raw = seg.join(" ");
      const lem = seg.map(phLemma).join(" ");
      const key = PHRASE_SET.has(raw) ? raw : (PHRASE_SET.has(lem) ? lem : null);
      if (key) { hit = { key: key, n: n }; break; }
    }
    if (hit) {
      const last = toks[i + hit.n - 1];
      out += `<span class="w ph" data-t="p" data-k="${esc(hit.key)}">${esc(text.slice(toks[i].s, last.e))}</span>`;
      pos = last.e; i += hit.n; continue;
    }
    const t = toks[i];
    const found = lookupWord(t.w);
    out += found
      ? `<span class="w has" data-t="w" data-k="${esc(found.key)}">${esc(t.w)}</span>`
      : `<span class="w">${esc(t.w)}</span>`;
    pos = t.e; i++;
  }
  return out + esc(text.slice(pos));
}

// ---- 吹き出し ----
const tip = $("tip");
let tipShowTimer = null, tipHideTimer = null, tipOverTip = false, tipAnchor = null;

function tipData(type, key) {
  if (!dictReady) return null;
  if (type === "p") {
    const e = PHRASES[key];
    return e ? { term: key, tag: "熟語", cls: "", e: e, sub: key.split(" ") } : null;
  }
  const e = WORDS[key];
  return e ? { term: key, tag: "単語", cls: "word", e: e, sub: null } : null;
}

function renderTip(type, key, backTo) {
  const d = tipData(type, key);
  if (!d) {
    tip.innerHTML = `<div class="tip-none">この語は辞書に登録されていません</div>`;
    return;
  }
  const mean = d.e[0], ex = d.e[1], exja = d.e[2];
  const chips = [];
  if (TOUCH) chips.push(`<button class="tip-chip" data-close="1">✕ 閉じる</button>`);
  if (backTo) chips.push(`<button class="tip-chip" data-back="${esc(backTo)}">← ${esc(backTo)}</button>`);
  if (d.sub) d.sub.forEach(w => {
    const f = lookupWord(w);
    if (f) chips.push(`<button class="tip-chip" data-word="${esc(f.key)}" data-from="${esc(key)}">${esc(w)}</button>`);
  });
  tip.innerHTML = `
    <div class="tip-head">
      <span class="tip-term">${esc(d.term)}</span>
      <span class="tip-tag ${d.cls}">${d.tag}</span>
      <button class="tip-say" data-say="${esc(d.term)}">🔊</button>
    </div>
    <div class="tip-mean">${esc(mean)}</div>
    <div class="tip-ex" data-say="${esc(ex)}" title="クリックで読み上げ">
      <div class="en">${esc(ex)}</div><div class="ja">${esc(exja)}</div>
    </div>
    ${chips.length ? `<div class="tip-chips">${chips.join("")}</div>` : ""}`;
}

// スマホ・タブレットはマウスを乗せる操作が無いので、タップで意味を出す
const TOUCH = window.matchMedia("(hover: none)").matches;
const isNarrow = () => window.innerWidth <= 720;

function placeTip(rect) {
  tip.classList.add("show");
  if (isNarrow()) {                 // 画面上部に固定して出す
    tip.classList.add("sheet");
    tip.style.left = "";
    tip.style.top = "";
    return;
  }
  tip.classList.remove("sheet");
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = rect.left, top = rect.bottom + 8;
  if (left + tw > window.innerWidth - 10) left = window.innerWidth - tw - 10;
  if (left < 10) left = 10;
  if (top + th > window.innerHeight - 10) top = rect.top - th - 8;
  if (top < 6) top = 6;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}

function hideTip() { tip.classList.remove("show"); tipAnchor = null; }

document.addEventListener("mouseover", (ev) => {
  if (TOUCH) return;                        // タッチ端末では下の click で扱う
  const el = ev.target.closest && ev.target.closest(".w[data-k]");
  if (!el) return;
  if (el.closest(".hidden-text")) return;   // 英文を隠している間は答えを見せない
  clearTimeout(tipHideTimer); clearTimeout(tipShowTimer);
  tipShowTimer = setTimeout(() => {
    tipAnchor = el;
    renderTip(el.dataset.t, el.dataset.k, null);
    placeTip(el.getBoundingClientRect());
  }, 180);
});
document.addEventListener("mouseout", (ev) => {
  if (TOUCH) return;
  const el = ev.target.closest && ev.target.closest(".w[data-k]");
  if (!el) return;
  clearTimeout(tipShowTimer);
  tipHideTimer = setTimeout(() => { if (!tipOverTip) hideTip(); }, 260);
});

// タッチ端末：単語をタップしたら意味を出す（文の読み上げには進ませない）
document.addEventListener("click", (ev) => {
  if (!TOUCH) return;
  const el = ev.target.closest && ev.target.closest(".w[data-k]");
  if (el) {
    if (el.closest(".hidden-text")) return;   // 伏せている間は答えを見せない
    ev.stopPropagation();
    ev.preventDefault();
    tipAnchor = el;
    renderTip(el.dataset.t, el.dataset.k, null);
    placeTip(el.getBoundingClientRect());
    return;
  }
  if (!ev.target.closest("#tip")) hideTip();   // 吹き出しの外をタップしたら閉じる
}, true);
tip.addEventListener("mouseenter", () => { tipOverTip = true; clearTimeout(tipHideTimer); });
tip.addEventListener("mouseleave", () => { tipOverTip = false; hideTip(); });
tip.addEventListener("click", (ev) => {
  if (ev.target.closest("[data-close]")) { hideTip(); return; }
  const say = ev.target.closest("[data-say]");
  if (say) { speak(say.dataset.say); return; }
  const wc = ev.target.closest("[data-word]");
  if (wc) {
    renderTip("w", wc.dataset.word, wc.dataset.from);
    if (tipAnchor) placeTip(tipAnchor.getBoundingClientRect());
    return;
  }
  const bk = ev.target.closest("[data-back]");
  if (bk) {
    renderTip("p", bk.dataset.back, null);
    if (tipAnchor) placeTip(tipAnchor.getBoundingClientRect());
  }
});
window.addEventListener("scroll", hideTip, true);
window.addEventListener("resize", hideTip);
window.addEventListener("orientationchange", hideTip);

// ---- 音声合成（TTS） ----
let enVoice = null;
let jaVoice = null;
function pickVoice() {
  // 声の品質はブラウザ依存。自然な順（Edge の Natural > Google > 標準）で選ぶ
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
  enVoice =
    vs.find(v => /Natural|Online/.test(v.name) && v.lang === "en-US") ||
    vs.find(v => /Google/.test(v.name) && v.lang === "en-US") ||
    vs.find(v => /Samantha|Ava|Allison/.test(v.name)) ||   // iPhone の高品質声
    vs.find(v => v.lang === "en-US") || vs[0] || null;
  const js = speechSynthesis.getVoices().filter(v => v.lang.startsWith("ja"));
  jaVoice =
    js.find(v => /Natural|Online/.test(v.name)) ||
    js.find(v => /Google/.test(v.name)) ||
    js.find(v => /Kyoko|O-?ren/.test(v.name)) ||           // iPhone の高品質声
    js[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

let ttsUnlocked = false;    // iOS 対策（下の unlockTTS を参照）

// iOS Safari は利用者の操作を伴わない読み上げを拒む。最初のタップの中で
// 音量0の読み上げを1回通しておくと、以降タイマーからの読み上げも通るようになる。
function unlockTTS() {
  if (ttsUnlocked) return;
  ttsUnlocked = true;
  try {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch {}
}

let ttsToken = 0;        // 読み上げの世代番号。cancel() で消えた古い読み上げの通知を無視するため
let partnerPending = null;  // 相手のセリフを読み上げ中のターン番号（割り込まれたら読み直す）

function speak(text, onend) { return speakCore(text, onend, "en"); }
function speakJa(text, onend) { return speakCore(text, onend, "ja"); }

function speakCore(text, onend, lang) {
  const token = ++ttsToken;
  // 相手が話している最中に別の音声（辞書の例文など）を鳴らすと、相手のセリフが
  // 途中で切れてしまう。その場合は割り込みが終わってから最初から読み直す。
  const interrupted = partnerPending;
  // 読み上げ中は、スピーカーから出た音を発話として拾わないよう聞き取りを止める。
  const resume = micWanted;
  ttsBusy = true;
  pauseListening();
  asPause();
  vPause();
  if (resume) setMicState("tts");

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (lang === "ja") {
    u.lang = "ja-JP";
    if (jaVoice) u.voice = jaVoice;
    u.rate = 1.0;
  } else {
    u.lang = "en-US";
    if (enVoice) u.voice = enVoice;
    u.rate = settings.rate;
  }

  const finish = () => {
    if (token !== ttsToken) return;   // 既に別の読み上げに切り替わっている
    ttsBusy = false;
    if (onend) onend();
    if (resume && micWanted) setTimeout(startListening, 250);
    else if (vocabWaitEn) setTimeout(vListen, 250);   // 単語練習の答え待ちに戻す
    else setTimeout(asMaybeListen, 250);   // 音声操作の聞き取りに戻す
    if (interrupted !== null && practice && practice.idx === interrupted) {
      setTimeout(playTurn, 300);      // 割り込みで切れた相手のセリフを読み直す
    }
  };
  u.onend = finish;
  u.onerror = finish;
  speechSynthesis.speak(u);
  return u;
}

// ---- 音声認識 ----
// 【重要】SpeechRecognition は無言が数秒続くと自分で終了する（continuous でも起きる）。
// 終了したまま放置すると「自分のターンで少し待つ／単語の意味を調べる」だけで
// マイクが黙って死ぬため、聞き取りたい状態が続く限り自動で張り直す。
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function micAvailable() { return !!SR; }

const IDLE_MIC_MS = 10 * 60 * 1000;   // これ以上無言が続いたら聞き取りを止める
let recog = null;        // 現在の認識インスタンス
let micWanted = false;   // いま聞き取っていたい状態か（自分のターン中）
let micTurn = null;      // 聞き取り対象のターン
let ttsBusy = false;     // 読み上げ中か
let micSince = 0;        // 聞き取りを始めた時刻
let micFails = 0;        // 聞き取りを始められなかった回数（原因の表示に使う）

// マイクが使えないと分かったら、理由と代わりの進め方を必ず画面に出す。
// （Safari や埋め込み表示では「対応はしているが許可されない」ことがあり、
//   黙って止まると理由が分からないため）
function micUnusable(reason) {
  micWanted = false;
  micTurn = null;
  pauseListening();
  setMicState("");
  if (freeChat) {
    setStatus(`<span class="mic-on">⚠ この環境ではマイクが使えません（${esc(reason)}）。</span><br>
      下の欄に英語を書いて送れば、そのまま会話を続けられます。`);
    freeBtns(true);
    return;
  }
  setStatus(`<span class="mic-on">⚠ この環境ではマイク判定が使えません（${esc(reason)}）。</span><br>
    英文を声に出して読んでから「言えた → 次へ」を押す形で練習してください。
    マイク判定を使いたい場合は、PCで開いてください。`);
  setBtns({ replay: true, answer: true, reveal: settings.mode === "hide", retry: true, next: true });
}

function setMicState(kind) {
  const el = $("micState");
  if (!el) return;
  if (kind === "listening")   el.innerHTML = `<span class="mic-live">🎤 聞き取り中</span>`;
  else if (kind === "tts")    el.innerHTML = `<span class="mic-idle">⏸ 読み上げ中は聞き取りを止めています</span>`;
  else if (kind === "paused") el.innerHTML = `<span class="mic-idle">⏸ 聞き取りを止めました（「🎤 もう一度話す」で再開できます）</span>`;
  else el.innerHTML = "";
}

// 聞き取りを始める／張り直す
function startListening() {
  if (!micWanted || ttsBusy || !micAvailable()) return;
  if (jaHelp) return;   // 日本語ヘルプ中は英語の判定を動かさない（認識は1つだけ）
  if (Date.now() - micSince > IDLE_MIC_MS) {   // 長時間無言なら止める
    micWanted = false;
    setMicState("paused");
    if (freeChat) {
      setStatus("⏸ しばらく声が無かったので聞き取りを止めました。"
                + "「🎤 もう一度話す」か、下の欄に書いて送ってください。");
      freeBtns(true);
    } else {
      setBtns({ replay: true, answer: true, reveal: settings.mode === "hide", retry: true, next: true });
    }
    return;
  }
  asPause();   // 音声認識は同時に1つしか動かせないため、先にアシスタント側を止める
  if (recog) { const old = recog; recog = null; try { old.abort(); } catch {} }

  const t = micTurn;
  const r = new SR();
  r.lang = "en-US";
  r.continuous = true;        // 途中で切れにくくする（それでも切れるので onend で張り直す）
  r.interimResults = false;
  r.maxAlternatives = 1;

  r.onresult = (e) => {
    if (recog !== r || !(practice || freeChat)) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const said = (e.results[i][0].transcript || "").trim();
        if (said) {
          micFails = 0;
          // フリー会話は正解が無いので採点せず、そのまま相手へ渡す
          if (freeChat) { freeSend(said); return; }
          // 音声操作がオンなら、発話をまずコマンドとして解釈する
          // （英語判定が動いている間はコマンドも英語で受ける。完全一致のみ）
          if (assistantOn && handleEnCommand(said, t)) return;
          showFeedback(said, t);
          return;
        }
      }
    }
  };

  r.onerror = (e) => {
    if (recog !== r) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      micUnusable("マイクの使用が許可されていません");
    } else if (e.error === "audio-capture") {
      micUnusable("マイクが見つかりません");
    } else if (e.error !== "no-speech" && e.error !== "aborted") {
      // network など。1回目は張り直して様子を見て、続いたら理由を出す
      micFails++;
      if (micFails >= 3) micUnusable("音声認識のエラー：" + e.error);
    }
    // no-speech / aborted は下の onend で張り直す
  };

  r.onend = () => {
    if (recog !== r) return;   // 自分で止めた分は張り直さない（読み上げ後などは別経路で再開する）
    recog = null;
    if (!micWanted || ttsBusy || !(practice || freeChat)) return;
    setTimeout(startListening, 250);
  };

  recog = r;
  try {
    r.start();
    setMicState("listening");
  } catch (err) {
    recog = null;
    micFails++;
    if (micFails >= 2) micUnusable("マイクの開始が拒否されました");
  }
}

// 読み上げの間だけ止める（自分のターンであることは保つ）
function pauseListening() {
  if (recog) { const old = recog; recog = null; try { old.abort(); } catch {} }
}

// ターンを終える・練習を止めるときに完全に止める
function stopListening() {
  micWanted = false;
  micTurn = null;
  pauseListening();
  setMicState("");
  setTimeout(asMaybeListen, 300);   // マイクが空いたら音声操作の聞き取りに戻す
}

// ============================================================
// AI 中継サーバーとの連携
//
// アプリは公開ページなので API キーを持てない。キーは Cloudflare Worker
// （AI中継サーバー フォルダ）に置き、アプリはその URL と合言葉だけを
// この端末に保存して呼び出す。未設定なら従来のルール方式のまま動く。
// ============================================================
let ai = store.get("ai", { url: "", token: "" });
let aiBusy = false;

// ---- フリー会話の接続先 ----
// PC（起動ファイルから開いた場合）は同じ場所のサーバーが POST /ai を受けるので、
// 設定なしで使える。スマホ・遠隔の家族は中継サーバーのURLと合言葉を設定して使う。
// どちらも PC 上の ai_core.py が答えるため、応答の中身は同じになる。
const IS_LOCALHOST = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
let chatLocal = false;        // このPCのサーバー（POST /ai）が使えるか
let chatRelay = false;        // 中継サーバー経由でPCに届くか
let chatRelayInfo = null;     // 中継サーバーの答え（PCが起動しているか等）

function chatReady() { return chatLocal || chatRelay; }

// 接続先を確かめる。押してから失敗させないため、ボタンを出す前に必ず通す。
async function chatProbe() {
  chatLocal = false;
  chatRelay = false;
  chatRelayInfo = null;

  if (IS_LOCALHOST) {
    try {
      const r = await fetch("/ai", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "health", payload: {} }),
      });
      const j = await r.json();
      chatLocal = !!(j && j.ok && j.result && j.result.ok);
    } catch (e) { chatLocal = false; }
    if (chatLocal) return true;
  }

  // スマホ・家族の端末はここ。中継サーバーは「PCが起動しているか」も返す。
  if (ai.url && ai.token) {
    try {
      const r = await fetch(ai.url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-App-Token": ai.token },
        body: JSON.stringify({ mode: "health", payload: {} }),
      });
      const j = await r.json();
      chatRelayInfo = (j && j.result) || null;
      chatRelay = !!(chatRelayInfo && chatRelayInfo.ok && chatRelayInfo.online);
    } catch (e) { chatRelayInfo = null; }
  }
  return chatReady();
}

function chatStateLabel() {
  if (chatLocal) return "有効（このPC）";
  if (chatRelay) return "有効（PC経由）";
  if (chatRelayInfo && chatRelayInfo.relay) return "PCが起動していません";
  if (ai.url && ai.token) return "繋がりません";
  return "未設定";
}

async function chatCall(mode, payload) {
  const local = chatLocal;
  const url = local ? "/ai" : ai.url;
  if (!url) { setAiState("⚠ AIの接続先が設定されていません"); return null; }
  const headers = { "Content-Type": "application/json" };
  if (!local) headers["X-App-Token"] = ai.token;
  try {
    const r = await fetch(url, { method: "POST", headers, body: JSON.stringify({ mode, payload }) });
    let j = null;
    try { j = await r.json(); } catch {}
    if (!r.ok || !j || !j.ok) {
      setAiState("⚠ " + ((j && j.error) || ("AIの呼び出しに失敗しました（" + r.status + "）")));
      return null;
    }
    setAiState("");
    return j.result;
  } catch (e) {
    setAiState(local ? "⚠ AIに繋がりません（起動ファイルから開き直してください）"
                     : "⚠ AIに繋がりません（中継サーバーのURLと、PCが起動しているかを確認してください）");
    return null;
  }
}

// 音声操作のAI（interpret / grade / ask）が使えるか。
// 中継サーバー（PC経由）はフリー会話の用途しか受け付けないため、
// そこへ interpret を投げると断られ、画面に警告が出続ける。
// 中継サーバーを設定している間は「無効」とみなし、音声操作はルール方式のままにする。
function aiReady() {
  return !!(ai.url && ai.token) && !(chatRelayInfo && chatRelayInfo.relay);
}

function setAiState(text) {
  const el = $("aiState");
  if (el) el.textContent = text || "";
}

async function aiCall(mode, payload) {
  if (!aiReady() || aiBusy) return null;
  aiBusy = true;
  setAiState("🤖 考えています…");
  try {
    const r = await fetch(ai.url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-App-Token": ai.token },
      body: JSON.stringify({ mode, payload }),
    });
    let j = null;
    try { j = await r.json(); } catch {}
    if (!r.ok || !j || !j.ok) {
      const msg = (j && j.error) || ("AIの呼び出しに失敗しました（" + r.status + "）");
      setAiState("⚠ " + msg);
      showAsHeard("⚠ " + msg);
      return null;
    }
    setAiState("");
    return j.result;
  } catch (e) {
    setAiState("⚠ AIに繋がりません（設定のURLを確認してください）");
    return null;
  } finally {
    aiBusy = false;
  }
}

// 発話をAIに解釈させて操作する。候補はアプリ側で名前の近さで絞って渡す
// （全402シーンを毎回送ると無駄に大きくなるため）
async function aiInterpret(utterance) {
  const cands = [];
  DATA.forEach(c => c.scenes.forEach(sc => {
    cands.push({ id: sc.id, name: sc.name, category: c.name, score: jaSim(utterance, sc.name) });
  }));
  cands.sort((a, b) => b.score - a.score);
  const top = cands.slice(0, 30).map(x => ({ id: x.id, name: x.name, category: x.category }));

  const cat = DATA.find(c => c.id === view.cat);
  const sc = view.scene ? currentScene() : null;
  const res = await aiCall("interpret", {
    utterance,
    page: view.page,
    category: cat ? cat.name : "",
    scene: sc ? sc.name : "",
    inPractice: !!practice,
    categories: DATA.map(c => ({ id: c.id, name: c.name })),
    candidates: top,
  });
  if (!res) return false;
  return runAiAction(res);
}

// AI が返した操作を実行する
function runAiAction(res) {
  const say = (res.say || "").trim();
  const t = (res.target || "").trim();
  const findScene = (id) => {
    for (const c of DATA) {
      const hit = c.scenes.find(x => x.id === id);
      if (hit) return { cat: c.id, scene: hit.id, name: hit.name };
    }
    return null;
  };
  switch (res.action) {
    case "open_category": {
      const c = DATA.find(x => x.id === t) || DATA.find(x => x.name === t);
      if (!c) return false;
      view = { page: "scenes", cat: c.id, q: "" };
      render();
      speakJa(say || (c.name + "を開きました。"));
      return true;
    }
    case "open_scene": {
      const hit = findScene(t);
      if (!hit) return false;
      asPending = { cat: hit.cat, scene: hit.scene, name: hit.name };
      asPendingAt = Date.now();
      updateAsBar();
      speakJa(hit.name + "、でよろしいですか？");
      return true;
    }
    case "start":
      if (view.page === "dialogue") { speakJa(say || "始めます。", () => startPractice()); return true; }
      return false;
    case "next_scene": {
      const nx = view.scene ? nextSceneAfter(view.cat, view.scene) : null;
      if (!nx) return false;
      if (practice) stopPractice(false);
      asPending = { cat: view.cat, scene: nx.id, name: nx.name };
      asPendingAt = Date.now(); updateAsBar();
      speakJa("次は、" + nx.name + "、です。進みますか？");
      return true;
    }
    case "answer":    if (practice) { asAnswer(); return true; } return false;
    case "hint":      if (practice) { asHint(); return true; } return false;
    case "prep":      if (practice) { asHintKind("prep"); return true; } return false;
    case "words":     if (practice) { asHintKind("words"); return true; } return false;
    case "translate": if (practice) { asJapanese(); return true; } return false;
    case "repeat":    if (practice) { asRepeat(); return true; } return false;
    case "slower":    asSlower(); return true;
    case "faster":    asFaster(); return true;
    case "next":      if (practice) { $("btnNext").click(); return true; } return false;
    case "stop":      if (practice) { stopPractice(false); speakJa(say || "終了しました。"); return true; } return false;
    case "vocab":     openVocab(); speakJa(say || "単語練習を開きます。"); return true;
    case "mode_recall":
      settings.mode = "hide"; saveSettings();
      if (view.page === "dialogue") render();
      speakJa(say || "思い出すモードにしました。");
      return true;
    case "mode_show":
      settings.mode = "show"; saveSettings();
      if (view.page === "dialogue") render();
      speakJa(say || "英文を見るモードにしました。");
      return true;
    case "ask":
      if (say) { showHint({ show: say }, null); speakJa(say); return true; }
      return false;
    default:
      return false;
  }
}

// 練習中の自由質問をAIに投げる
async function aiAsk(question) {
  const t = curTurn();
  const pp = prevPartnerTurn();
  const res = await aiCall("ask", {
    question,
    model_en: t ? t.en : "",
    model_ja: t ? t.ja : "",
    partner_en: pp ? pp.en : "",
  });
  if (!res || !res.answer) return false;
  showHint({ show: res.answer }, null);
  speakJa(res.answer);
  return true;
}

// 発話の採点をAIに任せる（模範文と語が違っても通じていれば正解にする）
async function aiGrade(said, t) {
  const res = await aiCall("grade", { said, model_en: t.en, model_ja: t.ja });
  if (!res) return false;
  const badge = `<span id="scoreBadge" class="${res.ok ? "score-high" : "score-low"}">AI判定 ${Math.round(res.score)}%</span>`;
  $("recognized").innerHTML = `あなた：「${esc(said)}」 ${badge}`;
  if (res.comment) showHint({ show: res.comment }, null);
  const el = $("en" + practice.idx);
  if (el) el.classList.remove("hidden-text");
  if (res.ok) {
    stopListening();
    setStatus("✅ " + (res.comment || "通じています！") );
    setBtns({ replay: false, answer: true, reveal: false, retry: true, next: true });
    speakJa(res.comment || "通じています。", () => {
      if (practice) practice.autoTimer = setTimeout(() => { practice.idx++; playTurn(); }, 400);
    });
  } else {
    setStatus("🔁 " + (res.comment || "もう一度どうぞ"));
    setBtns({ replay: true, answer: true, reveal: false, retry: true, next: true });
    speakJa(res.comment || "もう一度どうぞ。");
  }
  return true;
}

// ============================================================
// 音声アシスタント（音声でアプリを操作する）
//
// 制約：ブラウザの音声認識は一度に1つ・1言語しか動かせない。そこで
//   ・メニュー画面や、マイク判定オフの練習中 → 日本語コマンドで聞き取る
//   ・マイク判定オンの自分のターン → 英語判定が動いているため、
//     コマンドも英語（I don't know / hint / in Japanese など）で受ける
// マイクを勝手に開かないよう、毎回ボタンで明示的にオンにする（保存しない）。
// ============================================================
let assistantOn = false;
let asRecog = null;      // アシスタント用の認識インスタンス（日本語）
let asPending = null;    // 「はい」で実行する確認待ちの内容
let asPendingAt = 0;
let asChoices = null;   // 番号で選ばせる候補（紛らわしいとき）
let asSince = 0;         // 無音の起点（長時間無音なら自動で止める）

// 英語判定中に日本語で助けを求めるためのモード。
// 音声認識は一度に1言語しか動かせないので、合図で日本語に切り替える。
let jaHelp = false;
let jaHelpTimer = null;
const JA_HELP_MS = 30000;   // この時間だけ日本語で聞ける（発話ごとに延長）

function enterJaHelp() {
  if (jaHelp) { bumpJaHelp(); return; }
  jaHelp = true;
  pauseListening();          // 英語の判定を止める
  setMicState("");
  updateAsBar();
  speakJa("日本語でどうぞ。", () => { bumpJaHelp(); asMaybeListen(); });
}

function bumpJaHelp() {
  if (jaHelpTimer) clearTimeout(jaHelpTimer);
  jaHelpTimer = setTimeout(() => { if (jaHelp) exitJaHelp(true); }, JA_HELP_MS);
}

function exitJaHelp(announce) {
  if (!jaHelp) return;
  jaHelp = false;
  if (jaHelpTimer) { clearTimeout(jaHelpTimer); jaHelpTimer = null; }
  asPause();
  updateAsBar();
  const back = () => { if (micWanted) startListening(); else asMaybeListen(); };
  if (announce) speakJa("英語に戻ります。どうぞ。", back);
  else back();
}

function asPause() {
  if (asRecog) { const old = asRecog; asRecog = null; try { old.abort(); } catch {} }
}

function asMaybeListen() {
  updateAsBar();
  if (!assistantOn || !micAvailable() || ttsBusy || asRecog) return;
  if (micWanted && !jaHelp) return;   // 英語判定中は動かさない（日本語ヘルプ中だけ例外）
  if (vocabWaitEn) return;            // 単語練習の答え待ち中も動かさない
  if (freeChat) return;               // フリー会話中は英語の聞き取りを優先する
  if (Date.now() - asSince > IDLE_MIC_MS) {   // 長時間無音なら止める（開きっぱなし防止）
    setAssistant(false);
    showAsHeard("しばらく無音だったため音声操作を止めました");
    return;
  }
  const r = new SR();
  r.lang = "ja-JP";
  r.continuous = true;
  r.interimResults = false;
  r.maxAlternatives = 1;
  r.onresult = (e) => {
    if (asRecog !== r) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const heard = (e.results[i][0].transcript || "").trim();
        if (heard) { asSince = Date.now(); handleJaCommand(heard); return; }
      }
    }
  };
  r.onerror = (e) => {
    if (asRecog !== r) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
      setAssistant(false);
      showAsHeard("⚠ マイクが使えないため音声操作を止めました");
    }
  };
  r.onend = () => {
    if (asRecog !== r) return;   // 自分で止めた分は張り直さない
    asRecog = null;
    setTimeout(asMaybeListen, 250);
  };
  asRecog = r;
  try { r.start(); } catch { asRecog = null; }
  updateAsBar();
}

let asWatchdog = null;

function setAssistant(on) {
  assistantOn = on;
  if (on) {
    asSince = Date.now();
    asMaybeListen();
    // 読み上げの終了通知が届かない環境でも聞き取りが再開するよう、
    // 定期的に張り直しを試みる（asMaybeListen は条件を満たさなければ何もしない）
    if (!asWatchdog) asWatchdog = setInterval(() => { vListen(); asMaybeListen(); }, 1500);
  } else {
    asPause();
    vocabStopVoice();
    asPending = null;
    asChoices = null;
    if (jaHelp) { jaHelp = false; if (jaHelpTimer) clearTimeout(jaHelpTimer); jaHelpTimer = null; }
    if (asWatchdog) { clearInterval(asWatchdog); asWatchdog = null; }
  }
  updateAsBar();
}

function updateAsBar() {
  const bar = $("asBar"), btn = $("asBtn");
  if (!bar || !btn) return;
  btn.classList.toggle("on", assistantOn);
  btn.textContent = assistantOn ? (aiReady() ? "🎙 音声操作 ON（AI）" : "🎙 音声操作 ON") : "🎙 音声操作";
  bar.classList.toggle("show", assistantOn);
  bar.classList.toggle("jahelp", jaHelp);
  if (!assistantOn) return;
  let hint;
  if (asChoices) hint = "番号でどうぞ（1／2／3）。「やめる」で取り消し";
  else if (jaHelp) hint = "日本語でどうぞ：「ヒント」「前置詞は？」「単語は？」「◯◯って英語で何？」「答え」／「戻る」で英語に復帰";
  else if (asPending) hint = "「はい」で実行、「いいえ」で取り消し";
  else if (freeChat) hint = "フリー会話中は音声操作は使えません（英語の聞き取りを優先しています）";
  else if (practice && micWanted) hint = "困ったら「ヘルプ」と言えば日本語で聞けます（英語では help / hint / in Japanese / next / stop）";
  else if (practice) hint = "「ヒント」「前置詞は？」「単語は？」「◯◯って英語で何？」「わからない」「日本語で」「もう一度」「次へ」「終了」";
  else if (view.page === "vocab") hint = vocabWaitEn
    ? "🎤 英語で答えてください（分からなければ I don't know ／ repeat で再読 ／ stop で終了）"
    : (vocab ? "「答え」「言えた」「言えなかった」「発音」「次」「終了」"
             : "「はじめて」で20問出題します。「戻る」で前の画面へ");
  else if (view.page === "home") hint = "カテゴリ名（「病院」など）／「単語練習」／やりたいシーン名";
  else if (view.page === "scenes") hint = "シーン名を言うと確認して開始します。「戻る」も使えます";
  else hint = "「開始」で練習を始めます。「戻る」「次のシーン」も使えます";

}

function showAsHeard(text) {

  el.style.opacity = 1;
  setTimeout(() => { el.style.opacity = .55; }, 1800);

// ---- 日本語の言い回しの照合 ----
function normJa(x) {
  return x.toLowerCase().replace(/[\s。、．，,.・「」『』（）()？！?!…〜ー]/g, "");
}
function bigrams(x) { const g = new Set(); for (let i = 0; i < x.length - 1; i++) g.add(x.slice(i, i + 2)); return g; }
function jaSim(a, b) {
  a = normJa(a); b = normJa(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.includes(b) || b.includes(a)) return 0.9;
  const A = bigrams(a), B = bigrams(b);
  let hit = 0; A.forEach(g => { if (B.has(g)) hit++; });
  return hit / Math.max(1, Math.min(A.size, B.size));
}

const CAT_ALIAS = {
  shopping: ["買い物", "かいもの", "ショッピング"],
  friends: ["友達との会話", "友達", "ともだち", "友達との"],
  work: ["職場でのやり取り", "職場", "しょくば", "仕事"],
  travel: ["旅行", "りょこう"],
  hospital: ["病院", "びょういん"],
};

function findCategory(raw) {
  const q = normJa(raw.replace(/(に|へ)?(移動して|移動|行って|開いて|して)$/, ""));
  if (!q) return null;
  for (const c of DATA) {
    const names = [c.name].concat(CAT_ALIAS[c.id] || []);
    if (names.some(n => normJa(n) === q)) return c;
  }
  for (const c of DATA) {
    const names = [c.name].concat(CAT_ALIAS[c.id] || []);
    if (names.some(n => jaSim(q, n) >= 0.7)) return c;
  }
  return null;
}

// シーン名だけで探すと「エアコンが壊れてる時のやつ」のように
// 名前に出てこない言葉で言われたときに見つからない。
// そこで会話の中身（日本語訳の全文）も検索対象にする。
let sceneHay = null;
let gramIdf = null;
function sceneHaystack() {
  if (sceneHay) return sceneHay;
  sceneHay = [];
  const df = new Map();   // その2文字組が何シーンに出るか
  DATA.forEach(c => c.scenes.forEach(sc => {
    const body = sc.turns.map(t => t.ja).join("");
    const hay = normJa(sc.name + body);
    sceneHay.push({
      cat: c.id, scene: sc.id, name: sc.name,
      nameN: normJa(sc.name), hay,
    });
    const seen = new Set();
    for (let i = 0; i < hay.length - 1; i++) seen.add(hay.slice(i, i + 2));
    seen.forEach(g => df.set(g, (df.get(g) || 0) + 1));
  }));
  // 「する」「おねがい」のようにどのシーンにも出る文字列は重みをほぼ0にし、
  // 「めんぜい」「むしば」のような珍しい語を決め手にする
  const N = sceneHay.length;
  gramIdf = new Map();
  df.forEach((n, g) => gramIdf.set(g, Math.log(N / n)));
  return sceneHay;
}
function idf(g) {
  if (!gramIdf) sceneHaystack();
  const v = gramIdf.get(g);
  return v === undefined ? Math.log(sceneHay.length) : v;   // 未知語は最も重く
}

// 質問の言い方（〜のやつ、〜したい など）を落として、探したい中身だけ残す
function searchCore(raw) {
  return raw
    .replace(/[の]?(やつ|もの|ところ|場面|シーン|会話)(を|が)?$/, "")
    .replace(/(の)?(とき|時)(の)?$/, "")
    .replace(/(が|を|は)?(やりたい|したい|練習したい)(です)?$/, "")
    .replace(/(を)?(開いて|出して|お願いします|お願い|やって|して|ください)$/, "")
    .trim();
}

// 話し言葉とシーン名の言葉のずれを埋める。
// 左を言われたら右も探す語に加える（右はシーン名で使っている言い方）。
const SEARCH_SYN = {
  "寝られない": "不眠", "眠れない": "不眠", "眠れん": "不眠", "睡眠": "不眠",
  "壊れ": "不具合", "動かない": "不具合", "調子悪い": "不具合",
  "遅れ": "遅延", "遅刻": "遅延",
  "無くし": "失くし", "なくし": "失くし", "落とし": "忘れ物",
  "盗まれ": "盗難", "すられ": "盗難",
  "痛い": "痛み", "具合悪い": "体調不良", "気持ち悪い": "体調不良",
  "断り": "断る", "謝り": "謝る", "誘い": "誘う",
  "値段": "価格", "値引き": "価格", "まけて": "価格",
  "会計": "支払", "払い": "支払", "レジ": "支払",
  "休み": "休暇", "有休": "有給", "辞め": "退職",
  "怒られ": "クレーム", "苦情": "クレーム",
  "薬局": "薬", "処方": "薬",
};

function expandQuery(q) {
  let out = q;
  Object.keys(SEARCH_SYN).forEach(k => {
    if (q.includes(k)) out += SEARCH_SYN[k];
  });
  return out;
}

// 上位の候補をまとめて返す（紛らわしいときに選ばせるため）
function findSceneTop(raw, n) {
  const q = searchCore(raw);
  if (normJa(q).length < 2) return [];
  sceneHaystack();
  const qx = expandQuery(q);
  const chunks = (qx.match(/[一-龠]+|[ァ-ヶー]{2,}|[A-Za-z0-9]{2,}/g) || [])
    .map(x => normJa(x)).filter(x => x.length >= 1);
  const uniq = [...new Set(chunks)];
  const scored = [];

  if (uniq.length) {
    const w = uniq.map(k => {
      let df = 0;
      sceneHay.forEach(x => { if (x.hay.includes(k)) df++; });
      return Math.log(sceneHay.length / Math.max(1, df)) + 0.3;
    });
    const total = w.reduce((a, b) => a + b, 0);
    sceneHay.forEach(x => {
      let wn = 0, wb = 0;
      uniq.forEach((k, i) => {
        if (x.nameN.includes(k)) wn += w[i];
        if (x.hay.includes(k)) wb += w[i];
      });
      const score = Math.max(wn / total, (wb / total) * 0.5, jaSim(q, x.name) * 0.9)
        + (x.cat === view.cat ? 0.03 : 0);
      scored.push({ cat: x.cat, scene: x.scene, name: x.name, score });
    });
  } else {
    const qn = normJa(q);
    const grams = [];
    for (let i = 0; i < qn.length - 1; i++) grams.push(qn.slice(i, i + 2));
    const gu = [...new Set(grams)];
    const gw = gu.map(g => idf(g));
    const gt = gw.reduce((a, b) => a + b, 0) || 1;
    sceneHay.forEach(x => {
      let wn = 0, wb = 0;
      gu.forEach((g, i) => {
        if (x.nameN.includes(g)) wn += gw[i];
        if (x.hay.includes(g)) wb += gw[i];
      });
      const score = Math.max(wn / gt, (wb / gt) * 0.6, jaSim(q, x.name) * 0.9)
        + (x.cat === view.cat ? 0.03 : 0);
      scored.push({ cat: x.cat, scene: x.scene, name: x.name, score });
    });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.filter(x => x.score >= 0.28).slice(0, n || 3);
}

function findScene(raw) {
  const q = searchCore(raw);
  const qn = normJa(q);
  if (qn.length < 2) return null;
  sceneHaystack();

  // 問い合わせから内容語（漢字・カタカナ・英数のまとまり）を抜き出す。
  // 「の」「を」「したい」のような部分は、どのシーンにも出てくるので判定に使わない。
  const chunks = (q.match(/[一-龠]+|[ァ-ヶー]{2,}|[A-Za-z0-9]{2,}/g) || [])
    .map(x => normJa(x)).filter(x => x.length >= 1);
  const uniq = [...new Set(chunks)];

  let best = null;

  if (uniq.length) {
    // 珍しい内容語ほど重く見る（何シーンに出るかで重みを決める）
    const w = uniq.map(k => {
      let df = 0;
      sceneHay.forEach(x => { if (x.hay.includes(k)) df++; });
      return Math.log(sceneHay.length / Math.max(1, df)) + 0.3;
    });
    const total = w.reduce((a, b) => a + b, 0);

    sceneHay.forEach(x => {
      let wn = 0, wb = 0;
      uniq.forEach((k, i) => {
        if (x.nameN.includes(k)) wn += w[i];
        if (x.hay.includes(k)) wb += w[i];
      });
      // シーン名に入っているほうが強い証拠。本文中の言及は半分の重みにする
      // （別のシーンの会話に一度出てくるだけ、という場合があるため）
      const score = Math.max(wn / total, (wb / total) * 0.5, jaSim(q, x.name) * 0.9)
        + (x.cat === view.cat ? 0.03 : 0);
      if (!best || score > best.score) {
        best = { cat: x.cat, scene: x.scene, name: x.name, score };
      }
    });
  } else {
    // ひらがなだけの言い方は内容語が取れないので、2文字組の重み付けで見る
    const grams = [];
    for (let i = 0; i < qn.length - 1; i++) grams.push(qn.slice(i, i + 2));
    const gu = [...new Set(grams)];
    const gw = gu.map(g => idf(g));
    const gt = gw.reduce((a, b) => a + b, 0);
    if (!gt) return null;
    sceneHay.forEach(x => {
      let wn = 0, wb = 0;
      gu.forEach((g, i) => {
        if (x.nameN.includes(g)) wn += gw[i];
        if (x.hay.includes(g)) wb += gw[i];
      });
      const score = Math.max(wn / gt, (wb / gt) * 0.6, jaSim(q, x.name) * 0.9)
        + (x.cat === view.cat ? 0.03 : 0);
      if (!best || score > best.score) {
        best = { cat: x.cat, scene: x.scene, name: x.name, score };
      }
    });
  }
  return best && best.score >= 0.28 ? best : null;
}

function nextSceneAfter(catId, sceneId) {
  const c = DATA.find(x => x.id === catId);
  if (!c) return null;
  const i = c.scenes.findIndex(sc => sc.id === sceneId);
  return (i >= 0 && i + 1 < c.scenes.length) ? c.scenes[i + 1] : null;
}

function runPendingScene(pn) {
  view = { page: "dialogue", cat: pn.cat, scene: pn.scene, q: "" };
  render();
  speakJa(pn.name + "を始めます。", () => {
    if (view.page === "dialogue" && view.scene === pn.scene) startPractice();
  });
}

// ============================================================
// 段階ヒント
//   1回目=出だしと語数 → 2回目=使う単語 → 3回目=前置詞 → 4回目=答え
//   「前置詞は？」「単語は？」など、直接その種類を聞くこともできる。
// ============================================================
const PREPS = new Set(["in","on","at","for","to","from","with","of","about","by","into",
  "over","under","after","before","during","between","through","without","around","near",
  "past","up","down","off","out","as","like","onto","upon","along","behind","below","above"]);
// 骨組みで残す語（機能語）。ここを残すと「何を埋めればよいか」が見える
const KEEPW = new Set(["a","an","the","i","you","he","she","it","we","they","me","my","your",
  "his","her","its","our","their","this","that","these","those","is","are","am","was","were",
  "be","been","do","does","did","have","has","had","will","would","can","could","should",
  "may","might","must","not","and","or","but","if","so","there","here","what","when","where",
  "who","which","how","why","please","yes","no","i'm","it's","that's","don't","doesn't",
  "isn't","aren't","can't","won't","i'd","i'll","i've","let","us","one","some","any","all"]);

function sentWords(en) { return en.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g) || []; }

// その文の中で辞書が熟語として拾った見出しを返す（既存の照合をそのまま使う）
function matchedPhrases(en) {
  if (!dictReady) return [];
  const d = document.createElement("div");
  d.innerHTML = markup(en);
  return [...d.querySelectorAll(".w.ph")].map(el => el.dataset.k)
    .filter((k, i, a) => a.indexOf(k) === i);
}

// 内容語（動詞・名詞など）を伏せた骨組み。前置詞と機能語は残す
function skeleton(en) {
  return en.replace(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g, (w) => {
    const k = w.toLowerCase();
    if (KEEPW.has(k) || PREPS.has(k)) return w;
    return w[0] + "_".repeat(Math.max(1, w.length - 1));
  });
}

function contentWords(en) {
  const out = [];
  sentWords(en).forEach(w => {
    const k = norm(w);
    if (KEEPW.has(k) || PREPS.has(k)) return;
    if (out.some(x => norm(x) === k)) return;
    out.push(w);
  });
  return out;
}

function hintStart(t) {
  const w = sentWords(t.en);
  const head = t.en.split(/\s+/).slice(0, 2).join(" ");
  return { say: w.length + "語の文です。" + head + " で始まります。", show: skeleton(t.en) };
}

function hintWords(t) {
  const cw = contentWords(t.en).slice(0, 4);
  const parts = cw.map(w => {
    const f = dictReady ? lookupWord(w) : null;
    return f ? w + "、" + f.e[0].split(/[／/(（]/)[0] : w;
  });
  return {
    say: parts.length ? "使う単語は、" + parts.join("。") + "。" : "特別な単語はありません。",
    show: "使う単語：" + cw.join(" / ")
  };
}

function hintPreps(t) {
  const ps = sentWords(t.en).map(w => w.toLowerCase()).filter(w => PREPS.has(w));
  if (!ps.length) return { say: "この文に前置詞はありません。", show: "前置詞なし" };
  const uniq = [...new Set(ps)];
  const counts = uniq.map(x => {
    const n = ps.filter(y => y === x).length;
    return n > 1 ? x + " を" + n + "回" : x;
  });
  // 前置詞を含む熟語があれば一緒に言う（丸ごと覚えるのが早いため）
  const phKeys = matchedPhrases(t.en).filter(k => k.split(" ").some(w => PREPS.has(w)));
  const ph = phKeys.slice(0, 2).map(k => k + "、" + (PHRASES[k] ? PHRASES[k][0].split(/[／/(（]/)[0] : ""));
  return {
    say: "前置詞は、" + counts.join("、") + " です。" + (ph.length ? "熟語では、" + ph.join("。") + "。" : ""),
    show: "前置詞：" + uniq.join(" , ") + (phKeys.length ? "　熟語：" + phKeys.join(" / ") : "")
  };
}

function showHint(h, level) {
  const box = $("hintBox");
  if (!box) return;
  box.classList.add("show");
  box.innerHTML = (level ? `<span class="lv">ヒント ${level}</span> ` : "") +
    `<span class="skel">${esc(h.show)}</span>`;
}
function clearHint() {
  const box = $("hintBox");
  if (box) { box.classList.remove("show"); box.innerHTML = ""; }
}

// 「ヒント」を繰り返すと段階が上がる
function asHintStep() {
  const t = curTurn(); if (!t) return;
  if (!practice.hintLv || practice.hintAt !== practice.idx) { practice.hintLv = 0; practice.hintAt = practice.idx; }
  practice.hintLv++;
  const lv = practice.hintLv;
  if (lv === 1) { const h = hintStart(t); showHint(h, 1); speakJa(h.say); }
  else if (lv === 2) { const h = hintWords(t); showHint(h, 2); speakJa(h.say); }
  else if (lv === 3) { const h = hintPreps(t); showHint(h, 3); speakJa(h.say); }
  else { speakJa("答えを読みます。", () => asAnswer()); }
}

function asHintKind(kind) {
  const t = curTurn(); if (!t) return;
  const h = kind === "prep" ? hintPreps(t) : kind === "words" ? hintWords(t) : hintStart(t);
  showHint(h, null);
  speakJa(h.say);
}

// 「◯◯って英語で何？」（日本語 → 英語の逆引き。まず今の文の中から探す）
function asEnglishFor(termRaw) {
  const term = normJa(termRaw);
  if (!term) return;
  const hit = (k, mean, where) => {
    showHint({ show: termRaw + " → " + k }, null);
    speakJa(where + "、" + k + " です。" + mean);
  };
  const t = curTurn();
  if (t && dictReady) {
    for (const k of matchedPhrases(t.en)) {
      if (PHRASES[k] && normJa(PHRASES[k][0]).includes(term)) return hit(k, PHRASES[k][0], "この文では");
    }
    for (const w of sentWords(t.en)) {
      const f = lookupWord(w);
      if (f && normJa(f.e[0]).includes(term)) return hit(f.key, f.e[0], "この文では");
    }
  }
  if (dictReady) {
    for (const k in PHRASES) if (normJa(PHRASES[k][0]).includes(term)) return hit(k, PHRASES[k][0], "辞書では");
    for (const k in WORDS) if (normJa(WORDS[k][0]).includes(term)) return hit(k, WORDS[k][0], "辞書では");
  }
  speakJa("辞書に見つかりませんでした。");
}

// ---- 練習中の共通アクション（日本語・英語コマンドの両方から使う） ----
function curTurn() { return practice ? currentScene().turns[practice.idx] : null; }
function prevPartnerTurn() {
  if (!practice) return null;
  const turns = currentScene().turns;
  for (let i = Math.min(practice.idx, turns.length - 1); i >= 0; i--) {
    if (turns[i].s === "p") return turns[i];
  }
  return null;
}
function asAnswer() {   // 答えの英文を開示して読み上げる
  const t = curTurn(); if (!t) return;
  const el = $("en" + practice.idx); if (el) el.classList.remove("hidden-text");
  speak(t.en);
}
function asHint() { asHintStep(); }   // 段階ヒント（呼ぶたびに詳しくなる）
function asJapanese() { // 直前の相手のセリフ（質問）を日本語で読む
  const pp = prevPartnerTurn(); const t = curTurn();
  const ja = pp ? pp.ja : (t ? t.ja : "");
  if (ja) speakJa(ja);
}
function asRepeat() {   // 相手のセリフをもう一度
  const pp = prevPartnerTurn();
  if (pp) speak(pp.en);
}
function syncRateUI() {
  const r = $("rngRate"); if (r) { r.value = settings.rate; $("rateVal").textContent = settings.rate; }
}
function asSlower() {
  settings.rate = Math.max(0.6, +(settings.rate - 0.15).toFixed(2));
  saveSettings(); syncRateUI();
  speakJa("少しゆっくりにしました。", () => { if (practice) asRepeat(); });
}
function asFaster() {
  settings.rate = Math.min(1.2, +(settings.rate + 0.15).toFixed(2));
  saveSettings(); syncRateUI();
  speakJa("少し速くしました。", () => { if (practice) asRepeat(); });
}

// ---- 日本語コマンド ----
function handleJaCommand(heard) {
  showAsHeard("🎙 " + heard);
  const q = normJa(heard);
  if (!q) return;

  // 番号で選ばせている最中の返事
  if (asChoices && Date.now() - asPendingAt < 40000) {
    const nums = { "1": 1, "いち": 1, "ひとつ": 1, "いちばん": 1, "ひとつめ": 1,
                   "2": 2, "に": 2, "ふたつ": 2, "にばん": 2, "ふたつめ": 2,
                   "3": 3, "さん": 3, "みつ": 3, "さんばん": 3, "みっつめ": 3 };
    let pick = null;
    const m = heard.match(/[1-3１-３]/);
    if (m) pick = Number(m[0].replace(/[１-３]/, d => "123"["１２３".indexOf(d)]));
    if (!pick) { for (const k in nums) if (q.startsWith(k)) { pick = nums[k]; break; } }
    if (pick && asChoices[pick - 1]) {
      const c = asChoices[pick - 1];
      asChoices = null; clearHint(); updateAsBar();
      runPendingScene({ cat: c.cat, scene: c.scene, name: c.name });
      return;
    }
    if (/^(やめ|キャンセル|いいえ|ちがう|違う)/.test(q)) {
      asChoices = null; clearHint(); updateAsBar();
      speakJa("取り消しました。");
      return;
    }
    asChoices = null; clearHint(); updateAsBar();   // 番号以外なら通常の解釈に進む
  }

  // 確認待ちへの返事
  if (asPending && Date.now() - asPendingAt < 30000) {
    if (/^(はい|うん|おっけ|オッケ|ok|おけ|おねがい|お願い|やる|進んで|すすんで|開始|スタート)/.test(q)) {
      const pn = asPending; asPending = null; updateAsBar();
      runPendingScene(pn);
      return;
    }
    if (/^(いいえ|いえ|やめ|キャンセル|ちがう|違う|しない)/.test(q)) {
      asPending = null; updateAsBar();
      speakJa("取り消しました。");
      return;
    }
    asPending = null; updateAsBar();   // 返事以外なら確認を破棄して通常コマンドへ
  }

  // 次のシーン（練習中でも使えるよう、練習コマンドより先に判定）
  if (/次のシーン|つぎのシーン/.test(heard)) {
    const c = DATA.find(x => x.id === view.cat);
    const nx = view.scene ? nextSceneAfter(view.cat, view.scene) : (c ? c.scenes[0] : null);
    if (practice) stopPractice(false);
    if (nx) {
      asPending = { cat: view.cat, scene: nx.id, name: nx.name };
      asPendingAt = Date.now(); updateAsBar();
      speakJa("次は、" + nx.name + "、です。進みますか？");
    } else {
      speakJa(c ? "このカテゴリのシーンはこれで最後です。" : "先にカテゴリを開いてください。");
    }
    return;
  }

  // 単語学習中のコマンド
  if (view.page === "vocab" && handleVocabJa(q)) return;

  // 練習中（マイク判定オフのとき）の日本語コマンド
  if (practice && handlePracticeJa(q, heard)) return;

  if (/単語練習|単語学習|単語の練習|たんごれんしゅう|熟語練習|フラッシュカード|単語帳/.test(q)) {
    openVocab();
    speakJa("単語練習を開きます。「はじめて」と言うと出題します。");
    return;
  }
  if (/^(もどる|戻る|もどって|戻って)$/.test(q)) {
    backBtn.click();
    return;
  }
  if (/^(開始|かいし|スタート|すたーと|はじめて|始めて|練習開始)$/.test(q)) {
    if (view.page === "dialogue") speakJa("始めます。", () => startPractice());
    else speakJa("先にシーンを選んでください。");
    return;
  }
  if (/思い出すモード|日本語から/.test(q)) {
    settings.mode = "hide"; saveSettings();
    if (view.page === "dialogue") render();
    speakJa("日本語から思い出すモードにしました。");
    return;
  }
  if (/英文を見る|見て読むモード|表示モード/.test(q)) {
    settings.mode = "show"; saveSettings();
    if (view.page === "dialogue") render();
    speakJa("英文を見て読むモードにしました。");
    return;
  }
  if (/マイク判定.*(オン|おん|つけて|有効)/.test(q)) {
    settings.mic = true; saveSettings();
    const c = $("chkMic"); if (c) c.checked = true;
    speakJa("マイク判定をオンにしました。");
    return;
  }
  if (/マイク判定.*(オフ|おふ|切って|無効)/.test(q)) {
    settings.mic = false; saveSettings();
    const c = $("chkMic"); if (c) c.checked = false;
    speakJa("マイク判定をオフにしました。");
    return;
  }
  if (/^(ゆっくり|おそく|遅く)/.test(q)) { asSlower(); return; }
  if (/^(はやく|早く|速く)/.test(q)) { asFaster(); return; }

  // カテゴリ名
  const cat = findCategory(heard);
  if (cat) {
    view = { page: "scenes", cat: cat.id, q: "" };
    render();
    speakJa(cat.name + "を開きました。シーン名をどうぞ。");
    return;
  }

  // シーン名の検索。1位が抜けていれば確認、紛らわしければ番号で選ばせる
  const tops = findSceneTop(heard, 3);
  if (tops.length) {
    const clear = tops.length === 1 || (tops[0].score - tops[1].score) >= 0.15;
    if (clear) {
      asPending = { cat: tops[0].cat, scene: tops[0].scene, name: tops[0].name };
      asPendingAt = Date.now(); updateAsBar();
      speakJa(tops[0].name + "、でよろしいですか？");
    } else {
      asChoices = tops;
      asPendingAt = Date.now(); updateAsBar();
      showHint({ show: tops.map((x, i) => (i + 1) + ". " + x.name).join("　/　") }, null);
      speakJa("近いものが" + tops.length + "つあります。" +
        tops.map((x, i) => (i + 1) + "、" + x.name).join("。") + "。番号でどうぞ。");
    }
    return;
  }
  // ここまでルールで拾えなかった発話は AI に回す（設定してあるときだけ）
  if (aiReady() && normJa(heard).length >= 3) {
    // 練習中の質問らしければ質問として、それ以外は操作として解釈させる
    const looksLikeQuestion = /なぜ|なんで|どうして|どういう|違い|使い分け|丁寧|自然|ネイティブ|意味|\?|？/.test(heard);
    if (practice && looksLikeQuestion) { aiAsk(heard); return; }
    aiInterpret(heard).then(done => {
      if (!done && /やりたい|したい|開いて|お願い/.test(heard)) {
        speakJa("見つかりませんでした。別の言い方でどうぞ。");
      }
    });
    return;
  }

  // 「やりたい」等の意図があるのに見つからなかったときだけ返事する（雑音に反応しない）
  if (/やりたい|したい|開いて|お願い/.test(heard)) {
    speakJa("見つかりませんでした。別の言い方でどうぞ。");
  }
}

function handleVocabJa(q) {
  if (/最初から全部|一から|いちから|全部やり直/.test(q)) {
    store.set("vmode", "fresh"); vocab = null; render();
    speakJa("最初から順に全部出すモードにしました。「はじめて」でどうぞ。");
    return true;
  }
  if (/おまかせ|おすすめ|復習優先|復習モード/.test(q)) {
    store.set("vmode", "srs"); vocab = null; render();
    speakJa("復習優先のおまかせモードにしました。");
    return true;
  }
  if (/^(はじめて|始めて|開始|スタート|やる)/.test(q)) { const b = $("vStart"); if (b) b.click(); return true; }
  if (!vocab) return false;
  if (!vocab.shown && /答え|こたえ|わからない|分からない|見せて|ギブアップ/.test(q)) { vocabShowAnswer(); return true; }
  if (vocab.shown) {
    if (/言えた|いえた|正解|できた|おっけー|オッケー|まる/.test(q)) { gradeVocab(true); return true; }
    if (/言えなかった|いえなかった|だめ|ダメ|間違|まちが|ばつ|わからない|分からない/.test(q)) { gradeVocab(false); return true; }
    if (/発音|はつおん|読んで|もう一度|もういちど/.test(q)) {
      const c = vocab.deck[vocab.i]; speak(c.k + ". " + c.ex); return true;
    }
  }
  if (/^(つぎ|次|次へ|スキップ)/.test(q)) { if (vocab.shown) gradeVocab(false); else vocabShowAnswer(); return true; }
  if (/終了|やめる|やめて|ストップ/.test(q)) { vocab = null; view = { page: "home" }; render(); speakJa("単語練習を終わりました。"); return true; }
  return false;
}

function handlePracticeJa(q, raw) {
  // 日本語ヘルプ中の「戻る／もういい」で英語に復帰
  if (jaHelp && /^(もどる|戻る|もういい|わかった|分かった|ありがとう|ありがと|おわり|終わり|英語に戻|オッケー|おっけー)/.test(q)) {
    exitJaHelp(true); return true;
  }
  // 「◯◯って英語で何？」（日本語→英語の逆引き）
  const m = (raw || "").match(/(.+?)(?:って|は|を)?\s*(?:英語で|えいごで)(?:何|なん|どう|なんて)/);
  if (m) { bumpJaHelp(); asEnglishFor(m[1]); return true; }
  if (/前置詞|ぜんちし/.test(q)) { bumpJaHelp(); asHintKind("prep"); return true; }
  if (/単語|たんご|キーワード|きーわーど/.test(q)) { bumpJaHelp(); asHintKind("words"); return true; }
  if (/出だし|でだし|言い出|最初|さいしょ|どう始め|文の形|骨組み/.test(q)) { bumpJaHelp(); asHintKind("start"); return true; }
  if (/わからない|分からない|答え|こたえ|ギブアップ/.test(q)) { bumpJaHelp(); asAnswer(); return true; }
  if (/ヒント|ひんと|もっと詳しく|もうすこし|もう少し/.test(q)) { bumpJaHelp(); asHint(); return true; }
  if (/の意味/.test(q)) {
    const mm = (raw || "").match(/(.+?)\s*の意味/);
    if (mm) { bumpJaHelp(); asDefine(mm[1]); return true; }
  }
  // 文法や言い換えの質問は AI に回す（設定してあるときだけ）
  if (aiReady() && /なぜ|なんで|どうして|どういう|違い|使い分け|丁寧|自然|ネイティブ|他の言い方|言い換え/.test(raw || "")) {
    bumpJaHelp(); aiAsk(raw); return true;
  }
  if (/日本語|にほんご|訳して|やくして|どういう意味/.test(q)) { bumpJaHelp(); asJapanese(); return true; }
  if (/もう一度|もういちど|もっかい|繰り返/.test(q)) { bumpJaHelp(); asRepeat(); return true; }
  if (/^(つぎ|次|次へ|スキップ|すきっぷ)$/.test(q)) { $("btnNext").click(); return true; }
  if (/^(最初から|さいしょから|やり直し|やりなおし)$/.test(q)) { startPractice(); return true; }
  if (/終了|しゅうりょう|やめる|やめて|ストップ|停止/.test(q)) {
    stopPractice(false); speakJa("練習を終了しました。"); return true;
  }
  if (/ゆっくり/.test(q)) { asSlower(); return true; }
  if (/速く|早く|はやく/.test(q)) { asFaster(); return true; }
  return false;
}

function handleEnCommand(saidRaw, t) {
  const x = saidRaw.toLowerCase().replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim();
  const next = () => $("btnNext").click();
  const stop = () => { stopPractice(false); speakJa("練習を終了しました。"); };
  // 日本語ヘルプへ切り替える合図。日本語で「ヘルプ」と言っても英語認識が
  // help と拾うことが多いので、取りこぼしを減らすため候補を広く持つ。
  const JA_TRIGGER = ["help", "help me", "helped", "japanese", "japanese help",
    "question", "i have a question", "wakaranai", "wakannai", "wa ka ra nai",
    "walk around nai", "nihongo", "help nihongo", "sos", "hell", "held", "helped me"];
  if (JA_TRIGGER.includes(x)) { showAsHeard("🎙 " + saidRaw); enterJaHelp(); return true; }

  const table = {
    "i don't know": asAnswer, "i dont know": asAnswer, "help me please": asAnswer,
    "i give up": asAnswer, "answer": asAnswer, "answer please": asAnswer,
    "the answer": asAnswer, "play the answer": asAnswer,
    "hint": asHint, "hint please": asHint, "give me a hint": asHint,
    "in japanese": asJapanese, "japanese": asJapanese, "japanese please": asJapanese,
    "translate": asJapanese, "translation": asJapanese,
    "one more time": asRepeat, "repeat": asRepeat, "repeat please": asRepeat,
    "again": asRepeat, "say that again": asRepeat,
    "slower": asSlower, "slower please": asSlower, "speak slower": asSlower,
    "faster": asFaster, "speak faster": asFaster,
    "next": next, "next please": next, "skip": next,
    "stop": stop, "stop practice": stop, "finish": stop,
    "start over": () => startPractice(),
  };
  if (table[x]) { showAsHeard("🎙 " + saidRaw); table[x](); return true; }
  const m = x.match(/^what does (.+) mean$/) || x.match(/^what's (.+)$/) ||
            x.match(/^what is (.+)$/) || x.match(/^meaning of (.+)$/);
  if (m) { showAsHeard("🎙 " + saidRaw); asDefine(m[1]); return true; }
  return false;
}

function asDefine(term) {
  const key = norm(term.trim());
  let e = dictReady ? PHRASES[key] : null;
  if (!e && dictReady) {
    const lem = key.split(" ").map(phLemma).join(" ");
    e = PHRASES[lem];
  }
  if (!e && dictReady && key.split(" ").length === 1) {
    const f = lookupWord(key);
    if (f) e = f.e;
  }
  if (e) speakJa(term + "。" + e[0]);
  else speakJa("辞書に見つかりませんでした。画面の単語をタップすると意味が出ます。");
}
