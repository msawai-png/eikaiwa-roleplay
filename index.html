// ============================================================
// 単語・熟語の学習
//
// 出題は「日本語 → 英語」。課題が「言いたいことが英語で出てこない」なので、
// 英語を見て意味を答える向きでは練習にならない。
// 間隔反復（Leitner 方式）で、正解した項目は次に出るまでの間隔を伸ばす。
// ============================================================
const VBOX_DAYS = [0, 1, 3, 7, 21];   // 箱1〜5の再出題間隔（日）
const DAY_MS = 86400000;

// ---- 品詞の自動分類 ----
// 前置詞・接続詞などの閉じた品詞は語のリストで、動詞・名詞・形容詞・副詞は
// 辞書の意味欄（日本語）の語尾から判定する。完全ではないが出題の絞り込み用途には足りる。
const POS_CONJ = new Set(["and","or","but","because","so","if","although","though",
  "while","whether","unless","since","once","than","when","whereas"]);
const POS_FUNC = new Set(["i","you","he","she","it","we","they","me","him","her","us","them",
  "my","your","his","its","our","their","mine","yours","this","that","these","those",
  "who","what","which","where","why","how","whose","there","here",
  "do","does","did","have","has","had","will","would","can","can't","could","should",
  "may","might","must","shall","is","are","am","was","were","be","been","being",
  "a","an","the","some","any","no","every","each","all","both","few","many","much",
  "more","most","other","another","either","neither","none","something","anything",
  "nothing","everything","someone","anyone","somewhere","anywhere","nobody",
  "yes","not","please","hello","hi","hey","okay","ok","oh","thanks","thank","bye",
  "certainly","sure","let","let's","shall","myself","yourself",
  "i'm","i'd","i'll","i've","it's","that's","what's","where's","here's","there's",
  "don't","doesn't","didn't","isn't","aren't","wasn't","won't","can't","couldn't",
  "shouldn't","haven't","you're","you'd","you'll","you've","we're","we'll","they're",
  "it'll","that'll","o'clock","mr","mrs","ms"]);
const POS_NUM = new Set(["one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fifteen","twenty","thirty","forty","fifty","sixty",
  "seventy","eighty","ninety","hundred","thousand","million","first","second","third",
  "fourth","fifth","twelfth","half","quarter"]);

// 判定を間違えやすい語の決め打ち（実測で誤分類が出たもの）
const POS_OVR = { too: "adv", then: "adv", now: "adv", soon: "adv", well: "adv",
  often: "adv", always: "adv", sometimes: "adv", usually: "adv", maybe: "adv",
  almost: "adv", together: "adv", again: "adv", away: "adv", back: "adv",
  understood: "verb", right: "noun", left: "noun", today: "noun",
  tomorrow: "noun", yesterday: "noun", tonight: "noun" };

function posOf(k, mean) {
  if (POS_OVR[k]) return POS_OVR[k];
  if (POS_FUNC.has(k)) return "func";
  if (POS_NUM.has(k) || /^(twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)-/.test(k)) return "num";
  if (PREPS.has(k)) return "prep";
  if (POS_CONJ.has(k)) return "conj";
  // 辞書の注釈（「〜の ing 形」「過去形」など）があれば最優先で使う
  if (/ing 形|過去形|過去分詞|三人称単数/.test(mean)) return "verb";
  if (/の複数形/.test(mean)) return "noun";
  if (/比較級/.test(mean)) return "adj";
  // 意味欄の最初の語義だけを取り出す（先頭の（注釈）や〜は外す）
  let m = (mean || "").replace(/^（[^）]*）/, "");
  m = m.split(/[／/，,（(]/)[0].trim().replace(/^[〜～…・「]/, "").replace(/[」。]$/, "");
  if (!m) return "noun";
  if (/する$/.test(m)) return "verb";
  if (/[うくぐすつぬぶむる]$/.test(m)) return "verb";
  if (/(い|しい)$/.test(m) && !/違い$|願い$|勢い$|支払い$|間違い$/.test(m)) return "adj";
  if (/(な|の)$/.test(m)) return "adj";
  if (/(に|く|と|り|て)$/.test(m)) return "adv";
  return "noun";
}
const POS_LABEL = { verb: "動詞", noun: "名詞", adj: "形容詞", adv: "副詞",
  prep: "前置詞", conj: "接続詞", func: "その他", num: "数" };

let vocabIdxCache = null;

// 各カテゴリに出てくる辞書の見出しを集める（単語と熟語の両方）
function vocabIndex() {
  if (vocabIdxCache) return vocabIdxCache;
  const byCat = {};
  const all = new Map();
  const d = document.createElement("div");
  DATA.forEach(c => {
    const set = new Set();
    c.scenes.forEach(sc => sc.turns.forEach(t => {
      d.innerHTML = markup(t.en);
      d.querySelectorAll(".w[data-k]").forEach(el => {
        const k = el.dataset.k, ty = el.dataset.t;
        set.add(k);
        if (!all.has(k)) all.set(k, ty);
      });
    }));
    byCat[c.id] = set;
  });
  const pos = new Map();
  all.forEach((ty, k) => {
    if (ty === "p") pos.set(k, "phrase");
    else pos.set(k, posOf(k, WORDS[k] ? WORDS[k][0] : ""));
  });
  // 出現回数（会話文の中で何回使われているか）。よく出るものから出題するために使う
  const freq = new Map();
  DATA.forEach(c => c.scenes.forEach(sc => sc.turns.forEach(t => {
    d.innerHTML = markup(t.en);
    d.querySelectorAll(".w[data-k]").forEach(el => {
      freq.set(el.dataset.k, (freq.get(el.dataset.k) || 0) + 1);
    });
  })));

  // 会話文には出てこないが辞書に載っている語も学習対象に入れる。
  // 並び順は辞書に書いた順（＝よく使われる順に並べてある）を尊重し、
  // 会話に出る語より後ろに来るよう出現回数は 0 として扱う。
  let rank = 0;
  const addRest = (obj, ty) => {
    Object.keys(obj).forEach(k => {
      rank++;
      if (all.has(k)) return;
      all.set(k, ty);
      pos.set(k, ty === "p" ? "phrase" : posOf(k, obj[k][0]));
      freq.set(k, 0);
      order.set(k, rank);   // 辞書内の並び順を覚えておく
    });
  };
  const order = new Map();
  addRest(WORDS, "w");
  addRest(PHRASES, "p");

  vocabIdxCache = { byCat, all, pos, freq, order };
  return vocabIdxCache;
}

function vocabEntry(k, ty) {
  const e = ty === "p" ? (PHRASES[k] || null) : (WORDS[k] || null);
  return e ? { k, ty, mean: e[0], ex: e[1], exja: e[2] } : null;
}

function vocabStore() { return store.get("vocab", {}); }
function vocabSave(v) { store.set("vocab", v); }

function vocabStats() {
  if (!dictReady) return { total: 0, learned: 0, due: 0 };
  const idx = vocabIndex();
  const v = vocabStore();
  const now = Date.now();
  let learned = 0, due = 0;
  Object.keys(v).forEach(k => {
    if (v[k].b >= 5) learned++;
    if (v[k].d <= now && v[k].b < 5) due++;
  });
  // 表示する総数は出題対象（機能語と数を除く）に揃える
  const total = [...idx.pos.values()].filter(x => !["func", "num"].includes(x)).length;
  return { total, learned, due };
}

// 出題する束を作る（期限が来たものを先に、足りなければ未学習から補う）
function vocabDeck(scope, limit) {
  const idx = vocabIndex();
  let keys = [];
  // 「すべて」でも the / a / I のような機能語と数は出さない（意味を答える学習にならないため）
  if (scope === "all") keys = [...idx.all.keys()].filter(k => !["func", "num"].includes(idx.pos.get(k)));
  else if (scope === "phrases") keys = [...idx.all.keys()].filter(k => idx.all.get(k) === "p");
  else if (["verb", "noun", "adj", "adv", "prep", "conj"].includes(scope))
    keys = [...idx.all.keys()].filter(k => idx.pos.get(k) === scope);
  else if (scope === "weak") {
    // 間違えた記録のあるもの全部（復習期限は無視して、よく出る順に）
    const vv = vocabStore();
    keys = Object.keys(vv).filter(k => (vv[k].ng || 0) >= 1 && (vv[k].b || 0) < 5 && idx.all.has(k));
    keys.sort((a, b) => (idx.freq.get(b) || 0) - (idx.freq.get(a) || 0));
    return keys.slice(0, limit).map(k => vocabEntry(k, idx.all.get(k))).filter(Boolean);
  } else keys = [...(idx.byCat[scope] || [])];

  const v = vocabStore();
  const now = Date.now();
  const byFreq = (a, b) => ((idx.freq.get(b) || 0) - (idx.freq.get(a) || 0))
    || ((idx.order.get(a) || 0) - (idx.order.get(b) || 0));
  const mode = store.get("vmode", "srs");

  if (mode === "fresh") {
    // 最初から全部：学習記録に関係なく、よく出る順に頭から20問ずつ進む。
    // どこまで進んだかは範囲ごとに覚えておき、端まで行ったら最初に戻る。
    keys.sort(byFreq);
    const posmap = store.get("vpos", {});
    const start = posmap[scope] || 0;
    const from = start >= keys.length ? 0 : start;
    const pick = keys.slice(from, from + limit);
    posmap[scope] = from + pick.length >= keys.length ? 0 : from + pick.length;
    store.set("vpos", posmap);
    return pick.map(k => vocabEntry(k, idx.all.get(k))).filter(Boolean);
  }

  // おまかせ（復習優先）：期限が来た復習を先に、残りは未学習をよく出る順に。
  // 一度正解したものは、次の期限が来るまで出ない。
  const dueList = [], newList = [];
  keys.forEach(k => {
    const st = v[k];
    if (!st) newList.push(k);
    else if (st.b < 5 && st.d <= now) dueList.push(k);
  });
  dueList.sort((a, b) => (v[a].d - v[b].d));
  newList.sort(byFreq);
  const pick = dueList.concat(newList).slice(0, limit);
  return pick.map(k => vocabEntry(k, idx.all.get(k))).filter(Boolean);
}

// 毎回同じ順にならない程度の軽い並べ替え（乱数は使うが再現性は不要）
function shuffleLite(a) {
  const x = a.slice();
  for (let i = x.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [x[i], x[j]] = [x[j], x[i]];
  }
  return x;
}

function vShape(k) {

function drawCard() {

    vocab = null;
    return;
  }
  const c = vocab.deck[vocab.i];
  const posL = c.ty === "p" ? "熟語" : (POS_LABEL[vocabIndex().pos.get(c.k)] || "単語");
  const head = `<span class="kind ${c.ty === "p" ? "ph" : ""}">${posL} ${vocab.i + 1} / ${vocab.deck.length}</span>`;

    </div>`;

    // 音声操作がオンなら、意味を読み上げて英語の答えを待つ
    if (assistantOn && micAvailable()) {
      vocab.tries = 0;
      vocabWaitEn = true;
      speakJa(c.mean);   // 読み上げ後、自動で英語の聞き取りが始まる
    }
  } else {
    area.innerHTML = `<div class="card">${head}
      <div class="ans">${esc(c.k)}</div>
      <div class="mean" style="font-size:16px">${esc(c.mean)}</div>
      <div class="ex">${esc(c.ex)}<div class="ja">${esc(c.exja)}</div></div>

      </div>
    </div>`;
    $("vOk").onclick = () => gradeVocab(true);

    $("vSay").onclick = () => speak(c.k + ". " + c.ex);
    if (vocab.autoNext) {
      // 音声モード：答えと例文を読み上げてから、自動で記録して次の問題へ
      const grade = vocab.autoNext; vocab.autoNext = null;
      speak(c.k + ". " + c.ex, () => setTimeout(() => gradeVocab(grade === "ok"), 500));
    } else {
      speak(c.k);
    }
  }
}

function gradeVocab(ok) {
  if (!vocab) return;
  const c = vocab.deck[vocab.i];
  const v = vocabStore();
  const st = v[c.k] || { b: 0, d: 0, ng: 0 };
  if (ok) {
    // 初めての正解は翌日から（同じ回にすぐ出てこないように）。以降は間隔を伸ばす
    st.b = Math.min(5, (st.b || 0) === 0 ? 2 : st.b + 1);
    vocab.ok++;
  } else {
    st.b = 1;   // 間違いはすぐ再出題の箱へ
    st.ng = (st.ng || 0) + 1;
    vocab.ng++;
  }
  st.d = Date.now() + VBOX_DAYS[Math.min(VBOX_DAYS.length - 1, st.b - 1)] * DAY_MS;
  v[c.k] = st;
  vocabSave(v);
  vocab.i++; vocab.shown = false;
  drawCard();
}

function vocabShowAnswer() { if (vocab && !vocab.shown) { vocab.shown = true; drawCard(); } }

// ---- 音声で答えるモード ----
// 日本語の意味を読み上げ → 英語の答えを聞き取り → 合っていれば「正解」、
// 違えば1回だけ再挑戦 → 答えを読み上げて不正解として次へ。手を使わず連続で回せる。
let vocabWaitEn = false;   // いま英語の答えを待っているか
let vRecog = null;

function vPause() {
  if (vRecog) { const old = vRecog; vRecog = null; try { old.abort(); } catch {} }
}
function vocabStopVoice() { vocabWaitEn = false; vPause(); }

function vListen() {
  if (!vocabWaitEn || !assistantOn || ttsBusy || micWanted || !micAvailable() || vRecog) return;
  asPause();
  const r = new SR();
  r.lang = "en-US";
  r.continuous = true;
  r.interimResults = false;
  r.maxAlternatives = 1;
  r.onresult = (e) => {
    if (vRecog !== r) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const said = (e.results[i][0].transcript || "").trim();
        if (said) { handleVocabAnswer(said); return; }
      }
    }
  };
  r.onerror = (e) => {
    if (vRecog !== r) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
      vocabStopVoice();
      showAsHeard("⚠ マイクが使えないため、ボタンで操作してください");
    }
  };
  r.onend = () => {
    if (vRecog !== r) return;
    vRecog = null;
    if (vocabWaitEn) setTimeout(vListen, 250);
  };
  vRecog = r;
  try { r.start(); } catch { vRecog = null; }
  updateAsBar();
}

const V_GIVEUP = new Set(["i don't know", "i dont know", "pass", "skip", "answer",
  "the answer", "give up", "i give up", "help", "no idea", "show me"]);
const V_STOP = new Set(["stop", "finish", "quit", "stop practice"]);

function handleVocabAnswer(saidRaw) {
  if (!vocab) { vocabStopVoice(); return; }
  showAsHeard("🎙 " + saidRaw);
  const x = saidRaw.toLowerCase().replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim();
  const c = vocab.deck[vocab.i];

  if (V_STOP.has(x)) {
    vocabStopVoice();
    vocab = null;
    view = { page: "home" };
    render();
    speakJa("単語練習を終わりました。");
    return;
  }
  if (x === "repeat" || x === "again" || x === "one more time") {
    speakJa(c.mean);   // 問題文をもう一度（読み上げ後に自動で聞き取りへ戻る）
    return;
  }
  if (V_GIVEUP.has(x)) { vocabReveal("ng"); return; }

  // 答え合わせ：答えの語が全部含まれていれば正解（言い直し・余分な語は許す）
  const saidW = new Set(tokenize(x));
  const keyW = tokenize(c.k);
  const okAll = keyW.length > 0 && keyW.every(w => saidW.has(w));
  if (okAll) {
    vocabStopVoice();
    speakJa("正解！", () => vocabReveal("ok", true));
    return;
  }
  // 1回だけ再挑戦
  vocab.tries = (vocab.tries || 0) + 1;
  if (vocab.tries >= 2) { vocabReveal("ng"); return; }
  speakJa("もう一度どうぞ。");   // 読み上げが終わると自動で聞き取りに戻る
}

// 答え面を開き、読み上げてから自動で成否を記録して次へ
function vocabReveal(grade, skipStop) {
  if (!skipStop) vocabStopVoice();
  if (!vocab) return;
  vocabWaitEn = false;
  vocab.autoNext = grade;
  vocab.shown = true;
  drawCard();
}

}

// 絞り込み結果でタイルを描き直す（一覧そのものは作り直さないので入力欄の状態が保たれる）
function drawSceneTiles() {
  const cat = DATA.find(c => c.id === view.cat);
  const counts = store.get("counts", {});
  const q = (view.q || "").trim().toLowerCase();
  const hit = cat.scenes.filter(s => !q || s.name.toLowerCase().includes(q));

  $("sceneGrid").innerHTML = hit.map(s => {
    const n = counts[cat.id + "/" + s.id] || 0;
    return `
    <div class="tile" onclick="openScene('${s.id}')">
      <div class="name">${esc(s.name)}</div>
      <div class="desc">${s.turns.length} 往復のやり取り</div>
      <div class="meta">${n > 0 ? `<span class="done-badge">✔ ${n} 回練習済み</span>` : "未練習"}</div>

function startPractice() {
  unlockTTS();            // 「会話を開始」のタップの中で読み上げを解禁する（iOS 対策）
  stopPractice(false);
  hideTip();
  practice = { idx: 0, autoTimer: null };
  panel.classList.add("show");
  playTurn();
}

function stopPractice(finished) {
  if (jaHelp) { jaHelp = false; if (jaHelpTimer) clearTimeout(jaHelpTimer); jaHelpTimer = null; }
  clearHint();
  ttsToken++;            // 進行中の読み上げの通知を無効化する
  speechSynthesis.cancel();
  ttsBusy = false;
  partnerPending = null;
  stopListening();
  if (practice && practice.autoTimer) clearTimeout(practice.autoTimer);
  practice = null;
  panel.classList.remove("show");
  document.querySelectorAll(".turn.active").forEach(el => el.classList.remove("active"));
  if (finished) {
    const key = view.cat + "/" + view.scene;
    const counts = store.get("counts", {});
    counts[key] = (counts[key] || 0) + 1;
    store.set("counts", counts);
    render();
    const done = document.createElement("div");
    done.className = "note";
    done.style.cssText = "background:#dcfce7;border-color:#86efac;color:#166534";
    done.innerHTML = "🎉 会話を最後まで練習しました！";
    main.prepend(done);
    setTimeout(() => done.remove(), 6000);

    // 音声操作がオンなら、次のシーンへ進むか声で確認する
    if (assistantOn) {
      const nx = nextSceneAfter(view.cat, view.scene);
      if (nx) {
        asPending = { cat: view.cat, scene: nx.id, name: nx.name };
        asPendingAt = Date.now(); updateAsBar();
        speakJa("お疲れさまでした。次のシーン、" + nx.name + "、に進みますか？");
      } else {
        speakJa("お疲れさまでした。このカテゴリのシーンはこれで最後です。");
      }
    }
  }
}

function highlight(i) {
  document.querySelectorAll(".turn.active").forEach(el => el.classList.remove("active"));
  const el = $("turn" + i);
  if (el) { el.classList.add("active"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

function playTurn() {
  if (!practice) return;
  const scene = currentScene();
  if (practice.idx >= scene.turns.length) { stopPractice(true); return; }
  const t = scene.turns[practice.idx];
  highlight(practice.idx);
  $("recognized").innerHTML = "";
  clearHint();

  if (t.s === "p") {
    setStatus("🔊 相手が話しています…");
    setBtns({ replay: false, answer: false, reveal: false, retry: false, next: false });
    const myIdx = practice.idx;
    partnerPending = null;          // この読み上げ自体を読み直し対象にしないため先に消す
    speak(t.en, () => {
      if (!practice || practice.idx !== myIdx) return;
      partnerPending = null;        // 最後まで読めたので読み直しは不要
      practice.autoTimer = setTimeout(() => { practice.idx++; playTurn(); }, 500);
    });
    partnerPending = myIdx;         // ここから先に割り込まれたら読み直す
  } else {
    beginMyTurn(t);
  }
}

function beginMyTurn(t) {
  partnerPending = null;
  const hidden = settings.mode === "hide";
  setBtns({ replay: true, answer: true, reveal: hidden, retry: true, next: true });
  if (settings.mic && micAvailable()) {
    setStatus(`<span class="mic-on">🗣 あなたの番です。英語で話してください（待っている間も、単語を調べている間も聞き取りは続きます）</span>`);
    micWanted = true;
    micTurn = t;
    micSince = Date.now();
    micFails = 0;
    startListening();
  } else {
    stopListening();   // 判定オフのときに前のターンの聞き取りが残らないように止める
    setStatus("🗣 あなたの番です。英文を声に出して読んだら「言えた → 次へ」を押してください");
  }
}

// 採点の下ごしらえ。活用形を原形に寄せ、a / the / is のような機能語は外す。
// 素の単語一致で採点すると、言えているのに機能語のせいで不正解になりやすい。
function canonWord(w) {
  const k = norm(w);
  const f = dictReady ? lookupWord(k) : null;
  return f ? f.key : k;
}
function contentSet(words) {
  const out = new Set();
  words.forEach(w => {
    const k = canonWord(w);
    if (POS_FUNC.has(k) || PREPS.has(k)) return;   // 機能語・前置詞は採点に使わない
    out.add(k);
  });
  return out;
}

function showFeedback(said, t) {
  const model = tokenize(t.en);
  const saidW = tokenize(said);

  // 内容語がどれだけ言えたかで採点する（語順・余分な語・冠詞の違いは許す）
  const modelC = contentSet(model);
  const saidC = contentSet(saidW);
  let hit = 0;
  modelC.forEach(w => { if (saidC.has(w)) hit++; });
  const score = modelC.size
    ? Math.round(hit / modelC.size * 100)
    : (saidW.length ? 100 : 0);   // 内容語が無い短い応答（Yes, please. など）は言えた扱い

  // 表示は、模範文に含まれる語=緑 / 含まれない語=赤（原形に寄せて見比べる）
  const modelAll = new Set(model.map(canonWord));
  const colored = saidW.map(w =>
    `<span class="${modelAll.has(canonWord(w)) ? "w-ok" : "w-ng"}">${w}</span>`).join(" ");
  const badge = `<span id="scoreBadge" class="${score >= 70 ? "score-high" : "score-low"}">内容一致 ${score}%</span>`;
  $("recognized").innerHTML = `あなた：「${colored}」 ${badge}`;

  // 隠しモードなら答えを開示
  const el = $("en" + practice.idx);
  if (el) el.classList.remove("hidden-text");

  // 語の一致だけでは「言えているのに不正解」になる場面があるため、
  // 一致率が高くないときは AI に意味で判定させる（設定してあるときだけ）
  if (aiReady() && score < 85) {
    aiGrade(said, t).then(done => { if (!done) fallbackFeedback(score, t); });
    return;
  }
  fallbackFeedback(score, t);
}

// AI を使わない場合の従来どおりの判定
function fallbackFeedback(score, t) {
  if (score >= 70) {
    stopListening();   // 直後に相手が話すので、その声を拾わないよう止める
    setStatus("✅ よく言えています！自動で次に進みます…");
    setBtns({ replay: false, answer: true, reveal: false, retry: true, next: true });
    practice.autoTimer = setTimeout(() => { practice.idx++; playTurn(); }, 2200);
  } else {
    setStatus("🔁 模範文と少し違いました。答えを確認して、もう一度話すか次へ進んでください");
    setBtns({ replay: true, answer: true, reveal: false, retry: true, next: true });
  }
}

function tokenize(s) {
  return s.toLowerCase().replace(/[^a-z0-9' ]/g, " ").split(/\s+/).filter(Boolean);
}

function setStatus(html) { $("panelStatus").innerHTML = html; }
function setBtns(v) {
  $("btnReplay").style.display = v.replay ? "" : "none";
  $("btnAnswerVoice").style.display = v.answer ? "" : "none";
  $("btnReveal").style.display = v.reveal ? "" : "none";
  $("btnRetry").style.display = v.retry ? "" : "none";
  $("btnNext").style.display = v.next ? "" : "none";
}

function freeAttachTip(tip) {
  for (let i = freeChat.log.length - 1; i >= 0; i--) {
    if (freeChat.log[i].who === "me") { freeChat.log[i].tip = tip; return; }
  }
}

function freeWait(on, first) {
  if (freeWaitTimer) { clearInterval(freeWaitTimer); freeWaitTimer = null; }
  if (!on) return;
  const t0 = Date.now();
  const tick = () => {
    if (!freeChat || !freeChat.busy) { freeWait(false); return; }
    const s = Math.round((Date.now() - t0) / 1000);
    setStatus(`<span class="free-wait">🤖 ${first ? "相手を呼び出しています" : "考えています"}…（${s}秒）</span>`
      + `<br><span style="font-size:12px;color:var(--sub)">この間はマイクを止めています`
      + `${first ? "。最初の1回は起動を含むため長めにかかります" : ""}</span>`);
  };
  tick();
  freeWaitTimer = setInterval(tick, 1000);
}

async function freeStart(scene, role, level, label) {
  unlockTTS();               // 「始める」のタップの中で読み上げを解禁する（iOS 対策）
  stopPractice(false);
  hideTip();
  freeChat = { conv: null, scene: scene, role: role, level: level,
               label: label || "", log: [], busy: true };
  render();
  freeBtns(false);
  setMicState("");
  freeWait(true, true);
  const r = await chatCall("chat_start", { scene: scene, role: role, level: level, greet: true });
  freeWait(false);
  if (!freeChat) return;     // 待っている間に終了された
  if (!r || !r.conv) { freeFail(); return; }
  freeChat.conv = r.conv;
  freeChat.busy = false;
  freePush("partner", r);
  speak(r.en, beginFreeTurn);
}

async function freeSend(text) {
  if (!freeChat || freeChat.busy) return;
  text = (text || "").trim();
  if (!text) return;
  stopListening();
  micWanted = false;
  freeChat.busy = true;
  freePush("me", { en: text });
  freeBtns(false);
  freeWait(true, false);
  const r = await chatCall("chat", { conv: freeChat.conv, text: text });
  freeWait(false);
  if (!freeChat) return;
  freeChat.busy = false;
  if (!r || !r.en) { freeFail(); return; }
  if (r.tip) { freeAttachTip(r.tip); }
  freePush("partner", r);
  speak(r.en, beginFreeTurn);
}

function beginFreeTurn() {
  if (!freeChat || freeChat.busy) return;
  freeBtns(true);
  if (settings.mic && micAvailable()) {
    setStatus(`<span class="mic-on">🗣 あなたの番です。英語で話してください</span>`
      + `<br><span style="font-size:12px;color:var(--sub)">`
      + `言い方が分からなければ、下の欄に日本語で書いて送っても答えてくれます</span>`);
    micWanted = true;
    micTurn = null;
    micSince = Date.now();
    micFails = 0;
    startListening();
  } else {
    stopListening();
    setStatus("🗣 あなたの番です。下の欄に英語を書いて送ってください"
      + "（この環境ではマイク判定が使えません）");
  }
}

function freeFail() {
  freeChat.busy = false;
  freeBtns(true);
  setStatus("⚠ 相手からの返事が受け取れませんでした。"
    + "「🎤 もう一度話す」でやり直すか、「■ 終了」で場面を選び直してください。");
}

function freeEnd(goHome) {
  const conv = freeChat && freeChat.conv;
  freeWait(false);
  ttsToken++;                       // 進行中の読み上げの通知を無効化する
  speechSynthesis.cancel();
  ttsBusy = false;
  partnerPending = null;
  stopListening();
  freeChat = null;
  panel.classList.remove("show");
  const row = $("freeInputRow");
  if (row) row.classList.remove("show");
  // PC側のプロセスを片付けてもらう。返事は待たない（画面を止めないため）
  if (conv) { chatCall("chat_end", { conv: conv }); }
  if (goHome) view = { page: "home" };
  render();
}

// パネルのボタン
$("btnReplay").onclick = () => {
  if (freeChat) { const m = freeLastPartner(); if (m) speak(m.en); return; }
  const scene = currentScene();
  const prev = scene.turns[practice.idx - 1];
  if (prev && prev.s === "p") speak(prev.en);
};
$("btnAnswerVoice").onclick = () => {
  const t = currentScene().turns[practice.idx];
  const el = $("en" + practice.idx);
  if (el) el.classList.remove("hidden-text");
  speak(t.en);
};
$("btnReveal").onclick = () => {
  const el = $("en" + practice.idx);
  if (el) el.classList.remove("hidden-text");
};
$("btnRetry").onclick = () => {
  if (freeChat) { $("recognized").innerHTML = ""; beginFreeTurn(); return; }
  if (practice.autoTimer) clearTimeout(practice.autoTimer);
  const t = currentScene().turns[practice.idx];
  $("recognized").innerHTML = "";
  beginMyTurn(t);
};
$("btnNext").onclick = () => {
  stopListening();
  if (practice.autoTimer) clearTimeout(practice.autoTimer);
  practice.idx++;
  playTurn();
};
$("btnStop").onclick = () => {
  if (freeChat) { freeEnd(false); return; }
  stopPractice(false);
};

$("freeSendBtn").onclick = () => {
  const el = $("freeInput");
  const t = el.value.trim();
  if (!t) return;
  el.value = "";
  freeSend(t);
};
$("freeInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("freeSendBtn").click(); }
});

render();
// フリー会話が使えるかを確かめてから入口を出す。
// 公開ページ（スマホ・家族）では、中継サーバーにPCが繋がっているかまで見る。
chatProbe().then(() => render());
</script>
</body>
</html>
